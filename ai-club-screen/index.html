        <div class="cal-bar">

        </div>
        <div class="panel cal-main"><div class="cal-dow" id="calDow"></div><div class="cal-grid" id="calGrid"></div><div class="cal-list" id="calList"></div></div>
        <div class="panel cal-side" id="calSide"></div>

    </section>
