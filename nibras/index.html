<style>
/* Layout: app shell — agent conversation as the main column, a tabbed study console (schedule · calendar · focus · quiz · progress) beside it; stacks on phones */
:root{
  --bg:#f6f3f4; --surface:#ffffff; --sunk:#efe9eb; --line:#e0d6d9;
  --fg:#231a1d; --muted:#6e6065;
  --accent:#7a1f33; --accent-soft:#f3e3e7; --on-accent:#fff7f8;
  --ok:#2f7a55; --ok-soft:#e2f1e9;
  --exam:#9a5d07; --exam-soft:#fbefd6;
  --hol:#a33a6e; --hol-soft:#f8e4ee;
  --tool:#1d2a33; --tool-fg:#cfe3ee; --tool-key:#f0b7c4;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161113; --surface:#1f181b; --sunk:#130e10; --line:#3a2e33;
  --fg:#f1e9ec; --muted:#ad9ca2;
  --accent:#e0798f; --accent-soft:#3b2128; --on-accent:#1b0d11;
  --ok:#6cc79a; --ok-soft:#1d3329;
  --exam:#f0c060; --exam-soft:#3a2d12;
  --hol:#ee8fc0; --hol-soft:#3a1b2b;
  --tool:#0e1418; --tool-fg:#bcd6e3; --tool-key:#f0a3b4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161113; --surface:#1f181b; --sunk:#130e10; --line:#3a2e33;
  --fg:#f1e9ec; --muted:#ad9ca2;
  --accent:#e0798f; --accent-soft:#3b2128; --on-accent:#1b0d11;
  --ok:#6cc79a; --ok-soft:#1d3329;
  --exam:#f0c060; --exam-soft:#3a2d12;
  --hol:#ee8fc0; --hol-soft:#3a1b2b;
  --tool:#0e1418; --tool-fg:#bcd6e3; --tool-key:#f0a3b4; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.7}
.wrap{max-width:1200px;margin:0 auto;padding-block:20px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.mark{width:46px;height:46px;border-radius:12px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark svg{width:26px;height:26px}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;margin:0}
.brand p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.status{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{font-size:12.5px;padding:5px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);display:inline-flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.pill b{color:var(--fg);font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.lang{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}

.grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}

/* chat */
.chat{display:flex;flex-direction:column;height:min(760px,calc(100vh - 140px));min-height:540px}
.chat-head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chat-head h2{font-family:var(--f-display);font-size:17px;margin:0;font-weight:500}
.chat-head span{font-size:12px;color:var(--muted)}
.log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{align-self:flex-start;background:var(--accent);color:var(--on-accent);border-end-start-radius:4px}
.msg.bot{align-self:flex-end;background:var(--sunk);border-end-end-radius:4px}
.msg.bot strong{color:var(--accent)}
.tool{align-self:flex-end;max-width:92%;background:var(--tool);color:var(--tool-fg);font-family:"IBM Plex Mono","IBM Plex Sans Arabic",ui-monospace,Menlo,monospace;font-size:12.5px;border-radius:8px;padding:8px 12px;direction:ltr;text-align:left;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.tool .k{color:var(--tool-key)}
.tool .r{opacity:.75}
.typing{align-self:flex-end;display:flex;gap:4px;padding:12px 14px;background:var(--sunk);border-radius:14px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:bob 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bob{50%{transform:translateY(-4px);opacity:.5}}
.chips{display:flex;gap:8px;padding:0 16px 10px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.chip:hover{border-color:var(--accent);color:var(--accent)}
form.ask{display:flex;gap:8px;padding:12px 16px 16px;border-top:1px solid var(--line)}
form.ask input{flex:1;min-width:0;padding:11px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--bg)}
.btn{border:0;background:var(--accent);color:var(--on-accent);border-radius:var(--r);padding:10px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}

/* console */
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{flex:1;background:none;border:0;padding:12px 10px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.view{padding:16px;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.h3{font-family:var(--f-display);font-size:19px;margin:0;font-weight:500;text-wrap:balance}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-inline-start:6px;vertical-align:middle;font-family:var(--f-body)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}

/* subjects */
.subs{display:flex;flex-direction:column;gap:6px}
.sub{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:10px;align-items:center;background:var(--sunk);border-radius:var(--r);padding:8px 12px}
.sub i{width:10px;height:10px;border-radius:3px}
.sub .n{font-weight:600;overflow-wrap:anywhere;line-height:1.4}
.sub .m{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.sub .x{background:none;border:0;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px}
.sub .x:hover{color:var(--accent)}
@media (max-width:520px){.sub{grid-template-columns:10px minmax(0,1fr) auto}.sub .m{grid-column:2/3;grid-row:2}}
.empty{font-size:13.5px;color:var(--muted);background:var(--sunk);border-radius:var(--r);padding:12px;text-align:center}
form.addsub{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,.8fr) auto;gap:8px}
@media (max-width:520px){form.addsub{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
form.addsub input,form.addsub select{min-width:0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:14px}
.sched{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow-y:auto}
.sday{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;padding:8px 10px;border-radius:var(--r);border:1px solid var(--line)}
.sday.today{border-color:var(--accent);background:var(--accent-soft)}
.sday.done{opacity:.6}
.sday .d{font-size:12.5px;color:var(--muted);line-height:1.35;font-variant-numeric:tabular-nums}
.sday .d b{display:block;color:var(--fg);font-size:14px}
.items{display:flex;flex-direction:column;gap:3px;font-size:13.5px;line-height:1.45;min-width:0}
.items span{display:flex;gap:7px;align-items:baseline}
.items span::before{content:"";flex:none;width:8px;height:8px;border-radius:2px;background:var(--c,var(--accent));transform:translateY(-1px)}
.items .ex{font-weight:600;color:var(--exam)}
.items .rv{color:var(--muted)}

/* calendar */
.months{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:4px}
.mo{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 10px;font-size:12.5px;line-height:1.3;text-align:center}
.mo small{display:block;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.mo[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.mo[aria-pressed="true"] small{color:var(--on-accent)}
.calhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.calhead .hij{font-size:12.5px;color:var(--muted)}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{font-size:11px;color:var(--muted);text-align:center;padding-bottom:2px}
.c{min-height:58px;border-radius:8px;border:1px solid var(--line);background:var(--bg);padding:4px 5px;display:flex;flex-direction:column;gap:2px;text-align:start;font-size:12px;line-height:1.2;min-width:0;overflow:hidden}
.c .n{font-weight:600;font-variant-numeric:tabular-nums}
.c .lb{font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.c.out{visibility:hidden}
.c.hol{background:repeating-linear-gradient(135deg,var(--hol-soft) 0 6px,transparent 6px 11px),var(--bg);border-color:transparent}
.c.hol .lb{color:var(--hol)}
.c.exw{background:var(--exam-soft);border-color:transparent}
.c.exw .lb{color:var(--exam)}
.c.mine{background:var(--exam);border-color:var(--exam);color:var(--surface)}
.c.mine .lb{color:var(--surface);font-weight:600}
.c.today{outline:2px solid var(--accent);outline-offset:-2px}
.c.sel{box-shadow:inset 0 0 0 2px var(--fg)}
.c .dots{display:flex;gap:2px;margin-top:auto}
.c .dots i{width:5px;height:5px;border-radius:50%;background:var(--c,var(--accent))}
@media (max-width:520px){.c{min-height:46px}.c .lb{display:none}}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.dayinfo{background:var(--sunk);border-radius:var(--r);padding:12px 14px;font-size:14px}
.dayinfo h4{margin:0 0 4px;font-size:14.5px}
.dayinfo ul{margin:0;padding-inline-start:18px}
.upc{display:flex;flex-direction:column;gap:6px}
.up{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:7px 10px;border-radius:8px;background:var(--sunk)}
.up b{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.up i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-inline-end:7px}

/* timer */
.timer{display:grid;place-items:center;gap:12px;padding-block:6px}
.ring{position:relative;width:200px;height:200px;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .face{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .t{font-family:var(--f-mono);font-size:38px;font-weight:500;direction:ltr;font-variant-numeric:tabular-nums}
.ring .s{font-size:12.5px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;vertical-align:middle}
.seg button{background:none;border:0;padding:7px 14px;font-size:13px;font-variant-numeric:tabular-nums}
.seg.mini button{padding:2px 10px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.note{font-size:14px;color:var(--muted);margin:0}

/* challenge */
.q{font-weight:600;font-size:16px;margin:0;text-wrap:pretty}
.opts{display:grid;gap:8px}
.opt{text-align:start;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.opt.wrong{border-color:var(--accent);color:var(--accent)}
.bar{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s linear}

/* stats */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--sunk);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-family:var(--f-mono);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.hist{display:flex;align-items:flex-end;gap:5px;height:90px;border-bottom:1px solid var(--line)}
.hist div{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.hist div.z{background:var(--line)}

.how{padding:18px}
.how h2{font-family:var(--f-display);font-weight:500;font-size:18px;margin:0 0 12px}
.loop{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;counter-reset:s}
@media (max-width:640px){.loop{grid-template-columns:repeat(2,minmax(0,1fr))}}
.loop div{background:var(--sunk);border-radius:var(--r);padding:12px;font-size:13.5px;color:var(--muted)}
.loop b{display:block;color:var(--fg);font-size:14.5px;margin-bottom:2px}
.loop b::before{counter-increment:s;content:counter(s) " · ";color:var(--accent);font-family:var(--f-mono)}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tools code{font-family:var(--f-mono);font-size:12px;background:var(--tool);color:var(--tool-fg);padding:3px 8px;border-radius:6px;direction:ltr}
footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
footer b{color:var(--fg);font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== hero band: one fixed dark look in both themes ===== */
:root{--h-bg:#120a0d;--h-bg2:#2b0f1a;--h-fg:#f7edf0;--h-mut:#c7adb5;--h-line:rgba(255,226,233,.13);--glow:#ffcf8a;--glow2:#e98aa0}
.hero{position:relative;overflow:hidden;background:radial-gradient(110% 85% at 50% -12%,var(--h-bg2) 0%,var(--h-bg) 62%);color:var(--h-fg);isolation:isolate}
.hero{border-bottom:1px solid var(--h-line)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-2}
.hero-in{max-width:1200px;margin:0 auto;padding-block:18px 84px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:48px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:21px;font-weight:700;color:var(--h-fg);text-decoration:none}
.logo .mk{width:36px;height:36px;border-radius:10px;background:linear-gradient(160deg,#9b2c45,#5a1626);display:grid;place-items:center;color:var(--glow);box-shadow:0 0 24px -4px rgba(255,207,138,.45)}
.logo .mk svg{width:20px;height:20px}
.nav-links{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.nav-links a{color:var(--h-mut);text-decoration:none;font-size:14px;padding:6px 10px;border-radius:8px}
.nav-links a:hover{color:var(--h-fg);background:rgba(255,255,255,.06)}
.hero .lang{background:transparent;border:1px solid var(--h-line);color:var(--h-fg)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:48px;align-items:center}
@media (max-width:900px){.hero-grid{grid-template-columns:minmax(0,1fr);gap:36px}.hero-in{gap:32px}}
.kick{font-family:var(--f-mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--glow);direction:ltr;display:inline-block}
.big{font-family:var(--f-display);font-weight:700;font-size:clamp(76px,12vw,156px);line-height:1;margin:6px 0 10px;background:linear-gradient(180deg,#fff8ea 8%,var(--glow) 52%,var(--glow2) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 8px 40px rgba(255,207,138,.22))}
.lead{font-size:clamp(17px,2vw,21px);line-height:1.75;color:var(--h-mut);max-width:36ch;margin:0;text-wrap:pretty}
.lead b{color:var(--h-fg);font-weight:600}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.b-glow,.b-line{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:12px 22px;font-weight:600;text-decoration:none;font-size:15px}
.b-glow{background:var(--glow);color:#2b0f1a;box-shadow:0 10px 34px -10px rgba(255,207,138,.7)}
.b-glow:hover{background:#ffdba3}
.b-line{border:1px solid var(--h-line);color:var(--h-fg);background:rgba(255,255,255,.03)}
.b-line:hover{background:rgba(255,255,255,.08)}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:34px;padding-top:20px;border-top:1px solid var(--h-line)}
@media (max-width:520px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.facts b{display:block;font-family:var(--f-mono);font-weight:500;font-size:24px;color:var(--h-fg);direction:ltr;text-align:left}
[dir="rtl"] .facts b{text-align:right}
.facts span{font-size:12.5px;color:var(--h-mut)}
.term{background:rgba(12,7,9,.74);border:1px solid var(--h-line);border-radius:16px;overflow:hidden;box-shadow:0 40px 90px -30px rgba(0,0,0,.75),0 0 80px -20px rgba(255,207,138,.25);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.term-top{display:flex;gap:6px;padding:11px 14px;border-bottom:1px solid var(--h-line);align-items:center}
.term-top i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.16)}
.term-top span{margin-inline-start:auto;font-family:var(--f-mono);font-size:11.5px;color:var(--h-mut);direction:ltr}
.term-body{-webkit-mask-image:linear-gradient(transparent,#000 22%);mask-image:linear-gradient(transparent,#000 22%);padding:16px;height:330px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;font-size:14px;overflow:hidden}
.tl{max-width:92%;line-height:1.6;animation:tlIn .35s ease both}
.tl-u{align-self:flex-start;background:var(--glow2);color:#1d0b11;padding:7px 13px;border-radius:13px;border-end-start-radius:4px;font-weight:500}
.tl-c{align-self:flex-end;font-family:"IBM Plex Mono","IBM Plex Sans Arabic",monospace;direction:ltr;text-align:left;color:#d5e7f0;background:rgba(255,255,255,.05);border:1px solid var(--h-line);border-radius:9px;padding:8px 11px;font-size:12.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.tl-c .k{color:var(--glow)}
.tl-b{align-self:flex-end;background:rgba(255,255,255,.08);color:var(--h-fg);padding:7px 13px;border-radius:13px;border-end-end-radius:4px}
.caret{display:inline-block;width:7px;height:1em;background:var(--glow);vertical-align:-2px;margin-inline-start:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@keyframes tlIn{from{opacity:0;transform:translateY(6px)}}

/* ===== section headings ===== */
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;scroll-margin-top:16px}
.sec-h h2{font-family:var(--f-display);font-size:clamp(26px,3.4vw,38px);line-height:1.2;margin:4px 0 0;font-weight:700;text-wrap:balance}
.sec-h p{margin:4px 0 0;color:var(--muted);max-width:52ch}
.kicker{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.18em;color:var(--accent);text-transform:uppercase;direction:ltr;display:inline-block}
#how,#film{scroll-margin-top:16px}

/* ===== film ===== */
.film{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:28px;align-items:center;padding:22px}
@media (max-width:820px){.film{grid-template-columns:minmax(0,1fr)}}
.film h2{font-family:var(--f-display);font-size:clamp(24px,3vw,32px);margin:6px 0 8px;font-weight:700}
.film p{margin:0;color:var(--muted)}
.film video{display:block;width:100%;max-width:100%;aspect-ratio:16/9;border-radius:12px;background:#120a0d;box-shadow:0 24px 60px -30px rgba(42,15,25,.6)}

/* ===== Nibras assistant widget (fixed dark look) ===== */
:root{--w-bg:#170d12;--w-bg2:#24111a;--w-card:rgba(255,255,255,.06);--w-line:rgba(255,226,233,.14);--w-fg:#f7edf0;--w-mut:#c2a8b1;--w-on:#22e08a}
.nb-fab{position:fixed;z-index:60;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:66px;height:66px;border-radius:50%;border:0;padding:0;background:radial-gradient(circle at 50% 30%,#4a1a2b,#1a0b11);box-shadow:0 14px 34px -10px rgba(42,15,25,.7),0 0 0 3px rgba(255,207,138,.35);display:grid;place-items:center;overflow:hidden}
.nb-fab .nb-av{width:58px;height:64px;margin-top:10px}
.nb-fab::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(255,207,138,.55);animation:ring 2.4s ease-out infinite;pointer-events:none}
@keyframes ring{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.25);opacity:0}}
.nb-tip{position:fixed;z-index:60;left:calc(max(18px,env(safe-area-inset-left,0px)) + 76px);bottom:calc(36px + env(safe-area-inset-bottom,0px));background:var(--w-bg);color:var(--w-fg);border:1px solid var(--w-line);padding:6px 12px;border-radius:10px;font-size:13px;white-space:nowrap;box-shadow:0 10px 24px -12px rgba(0,0,0,.6)}
.nb-modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:rgba(10,5,8,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.nb-card{position:relative;width:min(920px,100%);max-height:100%;overflow:auto;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.9fr);gap:12px;align-items:center;padding:36px 40px 0;border-radius:24px;color:var(--w-fg);background:radial-gradient(90% 120% at 15% 10%,#4b1a2d 0%,transparent 60%),linear-gradient(135deg,#2b1220,#150a10);border:1px solid var(--w-line);box-shadow:0 50px 120px -30px rgba(0,0,0,.8);animation:pop .35s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}}
@media (max-width:720px){.nb-card{grid-template-columns:minmax(0,1fr);padding:28px 22px 0}.nb-card .nb-fig{order:-1;max-width:190px;margin:0 auto}}
.nb-x{position:absolute;top:14px;inset-inline-end:16px;background:none;border:0;color:var(--w-mut);font-size:26px;line-height:1;padding:4px 8px;border-radius:8px}
.nb-x:hover{color:var(--w-fg);background:rgba(255,255,255,.06)}
.nb-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;border:1px solid var(--w-line);background:rgba(255,255,255,.04);font-size:13.5px;color:var(--w-mut)}
.nb-on{width:9px;height:9px;border-radius:50%;background:var(--w-on);box-shadow:0 0 0 3px rgba(34,224,138,.18)}
.nb-card h3{font-family:var(--f-display);font-size:clamp(34px,5vw,52px);line-height:1.15;margin:16px 0 18px;font-weight:700}
.nb-grad{background:linear-gradient(90deg,var(--glow),var(--glow2));-webkit-background-clip:text;background-clip:text;color:transparent}
.nb-type{min-height:110px;background:var(--w-card);border:1px solid var(--w-line);border-radius:16px;padding:16px 18px;font-size:16px;line-height:1.8}
.nb-acts{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 36px}
.nb-go{border:0;border-radius:14px;padding:13px 26px;font-weight:700;color:#2b0f1a;background:linear-gradient(135deg,var(--glow),#f5b37f);box-shadow:0 0 0 3px rgba(255,207,138,.25)}
.nb-ask{border:1px solid var(--w-line);border-radius:14px;padding:13px 26px;font-weight:700;color:var(--w-fg);background:rgba(255,255,255,.04)}
.nb-ask:hover{background:rgba(255,255,255,.09)}
.nb-fig{align-self:end;filter:drop-shadow(0 0 40px rgba(233,138,160,.35))}
.nb-fig .nb-av{width:100%;height:auto;display:block}
.nb-eyes{animation:bl 5s infinite;transform-origin:100px 112px}
@keyframes bl{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.nb-flame{animation:fl 1.6s ease-in-out infinite;transform-origin:100px 45px}
@keyframes fl{50%{transform:scale(.9,1.08)}}
.nb-panel{position:fixed;z-index:65;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));width:min(390px,calc(100vw - 32px));height:min(600px,calc(100vh - 130px));display:flex;flex-direction:column;border-radius:22px;overflow:hidden;color:var(--w-fg);background:linear-gradient(180deg,var(--w-bg2),var(--w-bg));border:1px solid var(--w-line);box-shadow:0 40px 90px -30px rgba(0,0,0,.8);animation:pop .3s ease both}
.nb-head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--w-line)}
.nb-ph{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 50% 30%,#4a1a2b,#1a0b11);overflow:hidden;display:grid;place-items:center;flex:none;box-shadow:0 0 0 2px rgba(255,207,138,.4)}
.nb-ph .nb-av{width:40px;height:44px;margin-top:8px}
.nb-head b{display:block;font-size:15.5px}
.nb-head small{display:flex;align-items:center;gap:6px;color:var(--w-on);font-size:12.5px}
.nb-head .nb-x{position:static;margin-inline-start:auto}
.nb-log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.nb-m{max-width:88%;padding:10px 14px;border-radius:16px;font-size:14.5px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}
.nb-m.b{align-self:flex-start;background:rgba(255,255,255,.07);border:1px solid var(--w-line);border-start-start-radius:4px}
.nb-m.u{align-self:flex-end;background:linear-gradient(135deg,#9b2c45,#6d1d31);border-start-end-radius:4px}
.nb-m a{color:var(--glow)}
.nb-m .nb-do{display:inline-block;margin-top:8px;border:1px solid rgba(255,207,138,.5);color:var(--glow);background:rgba(255,207,138,.08);border-radius:10px;padding:5px 12px;font-size:13px}
.nb-chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-top:1px solid var(--w-line)}
.nb-chip{border:1px solid var(--w-line);background:rgba(255,255,255,.04);color:var(--w-fg);border-radius:999px;padding:6px 13px;font-size:13px}
.nb-chip:hover{border-color:rgba(255,207,138,.6)}
.nb-form{display:flex;gap:10px;padding:12px 16px 16px;border-top:1px solid var(--w-line)}
.nb-form input{flex:1;min-width:0;background:rgba(0,0,0,.25);border:1px solid rgba(233,138,160,.5);color:var(--w-fg);border-radius:14px;padding:12px 14px}
.nb-form input::placeholder{color:var(--w-mut)}
.nb-send{width:48px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--glow2),#9b2c45);color:#fff;display:grid;place-items:center}
.nb-send svg{width:20px;height:20px}
[dir="rtl"] .nb-send svg{transform:scaleX(-1)}
@media (prefers-reduced-motion:reduce){.nb-fab::after{display:none}}
@media (max-width:640px){.nb-tip{display:none}}
</style>
</head>
<body>
<div id="app" dir="rtl" lang="ar">
<section class="hero" aria-label="Nibras">
  <canvas id="dust" aria-hidden="true"></canvas>
  <div class="hero-in">
    <nav class="nav">
      <a class="logo" href="#top" id="top"><span class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1.1 1.3 1.1 2.2h5c0-.9.5-1.7 1.1-2.2A6 6 0 0 0 12 3Z"/><path d="M12 7v3l2 1"/></svg></span><span data-i="brand">نبراس</span></a>
      <div class="nav-links">
        <a href="#try" data-i="nTry"></a><a href="#how" data-i="nHow"></a><a href="#film" data-i="nFilm"></a>
        <button class="lang" id="langBtn" type="button">English</button>
      </div>
    </nav>
    <div class="hero-grid">
      <div>
        <span class="kick">AI STUDY AGENT · 2026</span>
        <h1 class="big" data-i="brand">نبراس</h1>
        <p class="lead" data-h="heroLead"></p>
        <div class="cta">
          <a class="b-glow" href="#try" data-i="ctaTry"></a>
          <a class="b-line" href="#film" data-i="ctaFilm"></a>
        </div>
        <div class="facts">
          <div><b>9</b><span data-i="f1"></span></div>
          <div><b>AR·EN</b><span data-i="f2"></span></div>
          <div><b>0</b><span data-i="f3"></span></div>
          <div><b>100%</b><span data-i="f4"></span></div>
        </div>
      </div>
      <div class="term" aria-hidden="true">
        <div class="term-top"><i></i><i></i><i></i><span>nibras · agent trace</span></div>
        <div class="term-body" id="ticker"></div>
      </div>
    </div>
  </div>
</section>

<div class="wrap">
  <header class="sec-h" id="try">
    <div>
      <span class="kicker">01 · Try it</span>
      <h2 data-i="tryT"></h2>
      <p data-i="tagline"></p>
    </div>
    <div class="status">
      <span class="pill"><span class="dot"></span><span data-i="ready"></span></span>
      <span class="pill">🔥 <b id="pStreak">0</b> <span data-i="streakU"></span></span>
      <span class="pill">⭐ <b id="pPoints">0</b> <span data-i="pointsU"></span></span>
    </div>
  </header>

  <div class="grid">
    <section class="panel chat" aria-labelledby="chatT">
      <div class="chat-head">
        <h2 id="chatT" data-i="chatTitle"></h2>
        <span data-i="chatSub"></span>
      </div>
      <div class="log" id="log" aria-live="polite"></div>
      <div class="chips" id="chips"></div>
      <form class="ask" id="ask">
        <input id="q" autocomplete="off" aria-label="message">
        <button class="btn" id="send" data-i="send"></button>
      </form>
    </section>

    <section class="panel" aria-label="console">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-v="sched" aria-selected="true" data-i="tSched"></button>
        <button class="tab" role="tab" data-v="cal" aria-selected="false" data-i="tCal"></button>
        <button class="tab" role="tab" data-v="focus" aria-selected="false" data-i="tFocus"></button>
        <button class="tab" role="tab" data-v="challenge" aria-selected="false" data-i="tChal"></button>
        <button class="tab" role="tab" data-v="stats" aria-selected="false" data-i="tStats"></button>
      </div>

      <div class="view" id="v-sched">
        <div class="row between">
          <h3 class="h3"><span data-i="subjects"></span><span class="tag" id="exTag" data-i="example"></span></h3>
          <button class="btn sm" id="arrange" type="button" data-i="arrange"></button>
        </div>
        <div class="subs" id="subs"></div>
        <form class="addsub" id="addsub">
          <input id="fName" required aria-label="subject">
          <input id="fExam" type="date" required aria-label="exam date">
          <select id="fLevel" aria-label="level"><option value="1"></option><option value="2" selected></option><option value="3"></option></select>
          <button class="btn sm" data-i="add"></button>
        </form>
        <div class="row between">
          <span class="eyebrow" data-i="schedTitle"></span>
          <span class="eyebrow"><span data-i="perDay"></span>
            <span class="seg mini" id="perDay" style="margin-inline-start:6px"><button type="button" data-n="1" aria-pressed="false">1</button><button type="button" data-n="2" aria-pressed="true">2</button><button type="button" data-n="3" aria-pressed="false">3</button></span>
          </span>
        </div>
        <div class="sched" id="sched"></div>
      </div>

      <div class="view" id="v-cal" hidden>
        <div class="months" id="months"></div>
        <div class="calhead"><h3 class="h3" id="calTitle"></h3><span class="hij" id="calHij"></span></div>
        <div class="mgrid" id="mgrid"></div>
        <div class="legend">
          <span><i style="background:var(--hol-soft);border:1px solid var(--hol)"></i><span data-i="lgHol"></span></span>
          <span><i style="background:var(--exam-soft);border:1px solid var(--exam)"></i><span data-i="lgExam"></span></span>
          <span><i style="background:var(--exam)"></i><span data-i="lgMine"></span></span>
          <span><i style="background:var(--accent);border-radius:50%"></i><span data-i="lgStudy"></span></span>
        </div>
        <div class="dayinfo" id="calInfo"></div>
        <div>
          <div class="eyebrow" style="margin-bottom:6px" data-i="upcoming"></div>
          <div class="upc" id="upc"></div>
        </div>
      </div>

      <div class="view" id="v-focus" hidden>
        <div class="timer">
          <div class="ring">
            <svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--sunk)" stroke-width="8"/><circle id="arc" cx="60" cy="60" r="52" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="0"/></svg>
            <div class="face"><div><div class="t" id="tm">25:00</div><div class="s" id="tmState"></div></div></div>
          </div>
          <div class="seg" id="durs">
            <button type="button" data-m="25" aria-pressed="true">25</button>
            <button type="button" data-m="45" aria-pressed="false">45</button>
            <button type="button" data-m="90" aria-pressed="false">90</button>
          </div>
          <div class="row">
            <button class="btn" id="tStart" type="button" data-i="tStart"></button>
            <button class="btn ghost" id="tStop" type="button" data-i="tStop"></button>
          </div>
          <p class="note" id="tmToday"></p>
        </div>
      </div>

      <div class="view" id="v-challenge" hidden>
        <div class="row between"><span class="eyebrow" data-i="chHead"></span><span class="eyebrow" id="chScore"></span></div>
        <div class="bar"><i id="chBar" style="width:100%"></i></div>
        <p class="q" id="chQ"></p>
        <div class="opts" id="chOpts"></div>
        <p class="note" id="chExp"></p>
        <div><button class="btn ghost" id="chNext" type="button" data-i="chNext"></button></div>
      </div>

      <div class="view" id="v-stats" hidden>
        <div class="stats">
          <div class="stat"><b id="sDays">0</b><span data-i="sDays"></span></div>
          <div class="stat"><b id="sMin">0</b><span data-i="sMin"></span></div>
          <div class="stat"><b id="sAcc">—</b><span data-i="sAcc"></span></div>
          <div class="stat"><b id="sPts">0</b><span data-i="sPts"></span></div>
        </div>
        <div>
          <div class="eyebrow" style="margin-bottom:4px" data-i="hist"></div>
          <div class="hist" id="hist"></div>
        </div>
        <div><button class="btn ghost" id="reset" type="button" data-i="reset"></button></div>
      </div>
    </section>
  </div>

  <header class="sec-h" id="how"><div><span class="kicker">02 · How it thinks</span><h2 data-i="howT"></h2><p data-i="howP"></p></div></header>
  <section class="panel how">
    <div class="loop">
      <div><b data-i="h1"></b><span data-i="h1d"></span></div>
      <div><b data-i="h2"></b><span data-i="h2d"></span></div>
      <div><b data-i="h3"></b><span data-i="h3d"></span></div>
      <div><b data-i="h4"></b><span data-i="h4d"></span></div>
    </div>
  </section>

  <section class="panel film" id="film">
    <div>
      <span class="kicker">03 · Teaser</span>
      <h2 data-i="filmT"></h2>
      <p data-i="filmP"></p>
    </div>
    <video src="assets/nibras-teaser.mp4" poster="assets/teaser-poster.jpg" controls playsinline muted preload="metadata"></video>
  </section>

  <footer>
    <span>Design by <b>Afnan Aljohani</b> — AI &amp; Data Science Engineer</span>
    <span data-i="privacy"></span>

const COLORS=["#c0476a","#3f7fb5","#4b9a6e","#b07a1f","#7b5bb5","#2f9aa0"];

/* ================= dates ================= */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const D=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const TODAY=iso(new Date());
const add=(s,n)=>{const d=D(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((D(b)-D(a))/864e5);
const fmt=(s,o)=>D(s).toLocaleDateString(T("loc"),o||{weekday:"short",day:"numeric",month:"short"});
const inRange=(s,a,b)=>s>=a&&s<=b;

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const norm=s=>String(s).toLowerCase().replace(/[ً-ْـ]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
const has=(t,arr)=>arr.some(w=>t.includes(norm(w)));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ================= state ================= */
const KEY="nibras.v2";
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const subById=id=>S.subs.find(s=>s.id===id);

/* ================= scheduler ================= */
function trackOf(name){const n=norm(name);for(const k in TRACKS)if(TRACKS[k].k.some(w=>n.includes(norm(w))))return k;return null}
function buildSchedule(st){
 st=st||S;const subs=st.subs.filter(s=>s.exam>=TODAY);if(!subs.length)return[];
 const last=subs.reduce((m,s)=>s.exam>m?s.exam:m,TODAY);const cnt={},ti={};subs.forEach(s=>{cnt[s.id]=0;ti[s.id]=0});
 const out=[];
 for(let d=TODAY;d<=last;d=add(d,1)){
  const items=[];
  subs.filter(s=>s.exam===d).forEach(s=>items.push({sid:s.id,k:"exam"}));
  const open=subs.filter(s=>s.exam>d);
  open.filter(s=>diff(d,s.exam)===1).forEach(s=>{items.push({sid:s.id,k:"review"});cnt[s.id]++});
  const slots=Math.max(0,st.perDay-items.filter(i=>i.k!=="exam").length);
  const ranked=open.filter(s=>!items.some(i=>i.sid===s.id))
   .map(s=>({s,score:s.level*(1+4/Math.max(1,diff(d,s.exam)))/(cnt[s.id]+1)})).sort((a,b)=>b.score-a.score);
  ranked.slice(0,slots).forEach(({s})=>{const tr=trackOf(s.name);const list=tr?TRACKS[tr].topics:GENERIC;
   items.push({sid:s.id,k:"learn",t:list[ti[s.id]%list.length]});ti[s.id]++;cnt[s.id]++});
  if(items.length)out.push({d,items});
 }
 return out;
}

  {id:3,name:"AI Agents",exam:"2026-12-05",level:2,c:COLORS[2]}];
 const mins={};mins[add(TODAY,-3)]=50;mins[add(TODAY,-2)]=90;mins[add(TODAY,-1)]=25;
 const s={subs,nextId:4,perDay:2,sched:[],done:[add(TODAY,-3),add(TODAY,-2),add(TODAY,-1)],mins,points:40,answered:4,correct:3,example:true};
 s.sched=buildSchedule(s);return s;
}
const itemText=it=>{const s=subById(it.sid);const nm=s?s.name:"—";
 if(it.k==="exam")return `${T("exam")}: ${nm}`;if(it.k==="review")return `${T("review")}: ${nm}`;return `${nm} · ${pick(it.t[0],it.t[1])}`};
const MONTHS={يناير:1,فبراير:2,مارس:3,ابريل:4,مايو:5,يونيو:6,يوليو:7,اغسطس:8,سبتمبر:9,اكتوبر:10,نوفمبر:11,ديسمبر:12,january:1,february:2,march:3,april:4,june:6,july:7,august:8,september:9,october:10,november:11,december:12,jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function parseDate(t){
 let m=t.match(/(\d{1,2})\s*[\/\-]\s*(\d{1,2})/);let day=null,mon=null;
 if(m){day=+m[1];mon=+m[2]}
 else{for(const k in MONTHS){const re=new RegExp("(^|[^a-z])"+norm(k)+"(?![a-z])");const mm=t.match(re);if(mm){const i=mm.index+mm[1].length;mon=MONTHS[k];
   const before=t.slice(0,i).match(/(\d{1,2})\s*$/),after=t.slice(i).match(/^\S*\s*(\d{1,2})(?!\d)/);day=before?+before[1]:after?+after[1]:null;break}}}
 if(!mon||!day||mon>12||day>31)return null;const y=+TODAY.slice(0,4);let s=`${y}-${pad(mon)}-${pad(day)}`;if(s<TODAY)s=`${y+1}-${pad(mon)}-${pad(day)}`;return s;
}

const TOOLS={
 add_subject({name,exam,level}){if(!name||!exam)return{ok:false,error:"missing name or exam date"};

  return{ok:true,subject:name,exam,days_left:diff(TODAY,exam),schedule_days:S.sched.length}},
 build_schedule({per_day}){if(per_day)S.perDay=per_day;S.sched=buildSchedule();save();renderAll();switchTab("sched");
  const n=S.sched.reduce((a,d)=>a+d.items.filter(i=>i.k!=="exam").length,0);const td=S.sched.find(x=>x.d===TODAY);
  return{ok:S.sched.length>0,subjects:S.subs.filter(s=>s.exam>=TODAY).length,days:S.sched.length,sessions:n,today:td?td.items.map(itemText):[]}},
 next_task(){const d=S.sched.find(x=>x.d===TODAY);return d?{ok:true,date:TODAY,items:d.items.map(itemText),done:S.done.includes(TODAY)}:{ok:false}},
 next_exam(){const e=upcoming().find(x=>x.kind!=="hol");if(!e)return{ok:false};const s=S.subs.find(s=>s.exam===e.d);
  return{ok:true,label:s?s.name:e.label,date:e.d,days_left:diff(TODAY,e.d)}},

 explain_term({term,lang}){const g=GLOSSARY.find(g=>g[0].some(w=>term.includes(norm(w))));return g?{ok:true,term:g[1],definition:lang==="en"?g[3]:g[2]}:{ok:false}},
 mark_done(){const fresh_=!S.done.includes(TODAY);if(fresh_){S.done.push(TODAY);S.points+=20}save();renderAll();return{ok:true,date:TODAY,points:fresh_?20:0,streak:streak()}},
 get_progress(){const m=Object.values(S.mins).reduce((a,b)=>a+b,0);return{ok:true,done_days:S.done.length,focus_minutes:m,streak:streak(),accuracy:S.answered?Math.round(S.correct/S.answered*100):null}}
};

/* ================= agent: intent → tool ================= */
function route(text){
 const t=norm(text);const n=(t.match(/\d+/)||[])[0];
 if(has(t,["ضيف ماده","اضيف ماده","اضف ماده","ماده جديده","ضيفي ماده","add subject","new subject","add a subject"])){
  const exam=parseDate(t);const level=has(t,["صعب","hard"])?3:has(t,["سهل","easy"])?1:2;
  const name=text.replace(/[ً-ْ]/g,"").replace(/^.*?(مادة|ماده|subject)\s*/i,"").split(/\s*(?:[،,]|اختبار|exam|بتاريخ|تاريخ)/i)[0].trim();
  return["add_subject",{name:name||null,exam,level}];
 }
 if(has(t,["جدول","رتب","نظم","schedule","plan","خطه"])){const p=n&&+n<=3?+n:null;return["build_schedule",p?{per_day:p}:{}]}
 if(has(t,["متي اختبار","اختباري الجاي","الاختبار الجاي","اقرب اختبار","next exam","كم باقي"]))return["next_exam",{}];
 if(has(t,["مؤقت","ركز","تركيز","بومودورو","timer","focus"]))return["start_timer",{minutes:[25,45,90].includes(+n)?+n:25}];
 if(has(t,["تحدي","اختبرني","كويز","quiz","test me"]))return["daily_challenge",{}];
 if(has(t,["خلصت","انتهيت","انجزت","i'm done","im done","finished"]))return["mark_done",{}];
 if(has(t,["تقدم","وصلت","انجازي","progress","stats"]))return["get_progress",{}];
 if(has(t,["اليوم","وش اسوي","مهمتي","today","what should i"]))return["next_task",{}];
 if(GLOSSARY.some(g=>has(t,g[0])))return["explain_term",{term:t,lang:/[\u0600-\u06FF]/.test(text)?"ar":"en"}];
 return null;
}

  case "mark_done":return P(`ممتاز! سجّلت اليوم مكتمل${r.points?` و+${r.points} نقطة`:""} ⭐ سلسلتك ${r.streak} أيام.`,`Nice! Today is marked done${r.points?`, +${r.points} pts`:""} ⭐ Streak: ${r.streak} days.`);

  {q:"Is my data private?",k:["data","privacy","private","server","safe"],a:"Everything stays in your own browser (localStorage). No server, no sign-in, nothing is sent anywhere 🔒"},
  {q:"What tools does it use?",k:["tool","function"],a:"Nine tools: add subject, build schedule, today's task, next exam, timer, quiz, explain a term, mark done, and progress. Every call appears in the chat with its arguments and result."},
  {q:"Does it speak Arabic?",k:["arabic","language","عربي"],a:"Yes 👍 Press العربية at the top, or just write in Arabic and it answers in the language of your message."},
  {q:"Who built it?",k:["who","built","made","designer"],a:"Designed and built by Afnan Aljohani, AI & Data Science Engineer.",link:["LinkedIn","https://www.linkedin.com/in/afnan-aljohani-0b5a70315/"]},
  {q:"Watch the teaser 🎬",k:["teaser","video","watch"],a:"A 15-second teaser is just below, in the Teaser section 👇",go:"#film"}]};
let nbSeen=false,nbTyping=0;
try{nbSeen=sessionStorage.getItem("nibras.seen")==="1"}catch(e){}
const nbStill=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
function typeInto(el,text,done){const id=++nbTyping;if(nbStill()){el.textContent=text;done&&done();return}let i=0;const chars=[...text];
 const step=()=>{if(id!==nbTyping)return;el.textContent=chars.slice(0,i+=2).join("");const lg=$("#nbLog");if(lg)lg.scrollTop=lg.scrollHeight;if(i<chars.length)setTimeout(step,22);else done&&done()};step()}
function nbMsg(cls,text,extra){const d=document.createElement("div");d.className="nb-m "+cls;$("#nbLog").appendChild(d);
 if(cls==="u"){d.textContent=text;$("#nbLog").scrollTop=$("#nbLog").scrollHeight;return}
 const tx=document.createElement("span");d.appendChild(tx);typeInto(tx,text,()=>{if(extra)extra(d);$("#nbLog").scrollTop=$("#nbLog").scrollHeight})}
function nbAnswer(item){nbMsg("b",item.a,d=>{
 if(item.do){const b=document.createElement("button");b.type="button";b.className="nb-do";b.textContent=item.do[0];b.onclick=()=>{nbHidePanel();document.getElementById("try").scrollIntoView({behavior:nbStill()?"auto":"smooth"});handle(item.do[1])};d.appendChild(document.createElement("br"));d.appendChild(b)}
 if(item.link){const a=document.createElement("a");a.href=item.link[1];a.target="_blank";a.rel="noopener";a.textContent=item.link[0]+" ↗";d.appendChild(document.createElement("br"));d.appendChild(a)}
 if(item.go){const b=document.createElement("button");b.type="button";b.className="nb-do";b.textContent=pick("انتقل للعرض","Go to teaser");b.onclick=()=>{nbHidePanel();document.querySelector(item.go).scrollIntoView({behavior:nbStill()?"auto":"smooth"})};d.appendChild(document.createElement("br"));d.appendChild(b)}})}
function nbAsk(text){if(!text.trim())return;nbMsg("u",text);const t=norm(text);const list=FAQ[/[؀-ۿ]/.test(text)?"ar":"en"];
 const hit=list.find(f=>norm(f.q)===t)||list.find(f=>f.k.some(w=>t.includes(norm(w))));
 setTimeout(()=>{if(hit)nbAnswer(hit);else nbMsg("b",T("wFallback"),d=>{const b=document.createElement("button");b.type="button";b.className="nb-do";b.textContent=T("wSend");b.onclick=()=>{nbHidePanel();document.getElementById("try").scrollIntoView({behavior:nbStill()?"auto":"smooth"});handle(text)};d.appendChild(document.createElement("br"));d.appendChild(b)})},350)}
function nbReset(){nbTyping++;const lg=$("#nbLog");lg.innerHTML="";const ch=$("#nbChips");ch.innerHTML="";
 FAQ[L].forEach(f=>{const b=document.createElement("button");b.type="button";b.className="nb-chip";b.textContent=f.q;b.onclick=()=>nbAsk(f.q);ch.appendChild(b)});
 if(!$("#nbPanel").hidden)nbMsg("b",T("wWelcome"))}
function nbShowPanel(){$("#nbModal").hidden=true;$("#nbTip").hidden=true;const p=$("#nbPanel");if(!p.hidden)return;p.hidden=false;if(!$("#nbLog").children.length)nbMsg("b",T("wWelcome"));setTimeout(()=>$("#nbQ").focus(),50)}
function nbHidePanel(){$("#nbPanel").hidden=true}
function nbOpenModal(){$("#nbModal").hidden=false;$("#nbTip").hidden=true;$("#nbType").textContent="";typeInto($("#nbType"),T("wIntro"));setTimeout(()=>$("#nbGo").focus(),50)}
function nbCloseModal(){nbTyping++;$("#nbModal").hidden=true;nbSeen=true;try{sessionStorage.setItem("nibras.seen","1")}catch(e){}}
setTimeout(()=>{const t=$("#nbTip");if(t)t.hidden=true},9000);
$("#nbFab").onclick=()=>{if(!$("#nbPanel").hidden){nbHidePanel();return}if(!nbSeen)nbOpenModal();else nbShowPanel()};
$("#nbClose").onclick=nbCloseModal;
$("#nbModal").addEventListener("click",e=>{if(e.target.id==="nbModal")nbCloseModal()});
$("#nbGo").onclick=()=>{nbCloseModal();document.getElementById("try").scrollIntoView({behavior:nbStill()?"auto":"smooth"});setTimeout(()=>$("#q").focus({preventScroll:true}),400)};
$("#nbAsk").onclick=()=>{nbCloseModal();nbShowPanel()};
$("#nbPClose").onclick=nbHidePanel;
$("#nbForm").addEventListener("submit",e=>{e.preventDefault();const v=$("#nbQ").value;$("#nbQ").value="";nbAsk(v)});
addEventListener("keydown",e=>{if(e.key==="Escape"){if(!$("#nbModal").hidden)nbCloseModal();else if(!$("#nbPanel").hidden)nbHidePanel()}});

/* ================= boot ================= */
if(!S||!Array.isArray(S.subs))S=fresh();else S.sched=buildSchedule();
save();applyLang();renderAll();showQ();nbReset();tickReset();
say("msg bot",L==="ar"
 ?`هلا 👋 أنا <strong>نبراس</strong>، وكيلك للمذاكرة.\n${S.example?"حطّيت مواد مثال على تواريخ اختباراتك، وتقدرين تحذفينها. ":""}ضيفي موادك وتواريخ اختباراتها، وأنا أرتّب لك جدول يوازن بينها.`
 :`Hi 👋 I'm <strong>Nibras</strong>, your study agent.\n${S.example?"I've added example subjects on your exam dates; feel free to remove them. ":""}Add your subjects and exam dates and I'll build a balanced schedule.`);
})();
</script>
</body>
</html>
