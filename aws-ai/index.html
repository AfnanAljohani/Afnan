[1,"A dataset has equal numbers of cats and dogs, and both errors cost the same. Which simple metric is reasonable?","dataset فيها عدد متساوي من القطط والكلاب، والخطأين نفس التكلفة. أي مقياس بسيط مناسب؟","accuracy",["recall","rmse","rouge"],"Balanced classes + equal error costs = accuracy is fine.","فئات متوازنة وتكلفة أخطاء متساوية = Accuracy مناسب."],
[1,"A model is excellent on training data but poor on validation data. Which action is most likely to help?","نموذج ممتاز في بيانات التدريب لكنه ضعيف في بيانات التحقق. وش أكثر شي يساعد؟","L:Add more varied training data and use regularization or early stopping|إضافة بيانات تدريب أكثر وأنوع واستخدام regularization أو early stopping",["L:Train longer on the same data|تدريب أطول على نفس البيانات","L:Remove the validation set|حذف بيانات التحقق","L:Make the model more complex|زيادة تعقيد النموذج"],"This is overfitting; more data and regularization help it generalize.","هذا Overfitting؛ بيانات أكثر وregularization تساعده يعمم."],
[1,"A model performs poorly on both training and test data. What is the problem?","نموذج أداؤه ضعيف في بيانات التدريب والاختبار معًا. وش المشكلة؟","underfit",["overfit","drift","hallucination"],"Poor everywhere = underfitting (high bias).","ضعيف في كل مكان = Underfitting."],
[1,"A model was accurate at launch, but a year later its accuracy dropped because customers now shop mostly on mobile. What is this?","نموذج كان دقيق وقت الإطلاق، وبعد سنة نزلت دقته لأن العملاء صاروا يتسوقون من الجوال. وش هذا؟","drift",["overfit","underfit","hallucination"],"Production data changed = data drift.","تغيّر بيانات الإنتاج = Data drift."],
[1,"A company wants automatic alerts when production data starts to differ from the training data baseline. Which service fits?","شركة تبي تنبيهات تلقائية لما بيانات الإنتاج تبدأ تختلف عن بيانات التدريب. أي خدمة تناسب؟","modelmonitor",["clarify","cloudtrail","groundtruth"],"Drift detection in production = Model Monitor.","كشف الـ drift في الإنتاج = Model Monitor."],
[1,"Textract extracts values from loan forms. When confidence is below 90%, a person must check the result. Which service adds this step?","Textract يستخرج القيم من نماذج القروض. لما تكون الثقة أقل من ٩٠٪ لازم شخص يراجع. أي خدمة تضيف هذي الخطوة؟","a2i",["groundtruth","macie","clarify"],"Human review of low-confidence predictions = A2I.","مراجعة بشرية للتوقعات منخفضة الثقة = A2I."],
[1,"Which is the best BUSINESS metric for a new product recommendation feature?","وش أفضل مقياس «تجاري» لميزة توصيات منتجات جديدة؟","L:Increase in conversion rate and average order value|زيادة نسبة التحويل ومتوسط قيمة الطلب",["f1","bleu","perplexity"],"Business value is measured in revenue, conversion, cost or time saved.","القيمة التجارية تُقاس بالإيرادات والتحويل والتكلفة أو الوقت الموفَّر."],
[1,"Which statement about AI, ML and deep learning is correct?","أي عبارة صحيحة عن AI وML وDeep Learning؟","L:Deep learning is a subset of ML, which is a subset of AI|الـ Deep learning جزء من ML، والـ ML جزء من AI",["L:AI is a subset of deep learning|الـ AI جزء من Deep learning","L:ML and AI are unrelated|ML وAI ما بينهم علاقة","L:Deep learning does not use neural networks|Deep learning ما يستخدم شبكات عصبية"],"AI ⊃ ML ⊃ DL ⊃ GenAI (built on deep learning).","AI ⊃ ML ⊃ DL، والـ GenAI مبني على Deep learning."],
[1,"What best describes deep learning?","وش أفضل وصف للـ Deep learning؟","L:ML using neural networks with many layers that learn features from raw data|ML يستخدم شبكات عصبية بطبقات كثيرة تتعلم الـ features من البيانات الخام",["L:Rule-based if/else programming|برمجة بقواعد if/else","L:Any spreadsheet formula|أي معادلة في جدول بيانات","L:Only linear regression|الانحدار الخطي فقط"],"Many-layer neural networks = deep learning.","شبكات عصبية بطبقات كثيرة = Deep learning."],
[1,"Customer reviews, photos and call recordings are examples of which type of data?","مراجعات العملاء والصور وتسجيلات المكالمات أمثلة على أي نوع بيانات؟","L:Unstructured data|بيانات غير منظمة",["L:Structured tabular data|بيانات جدولية منظمة","L:Time-series data only|بيانات زمنية فقط","L:Labeled data only|بيانات مُعلَّمة فقط"],"No fixed rows and columns = unstructured.","ما لها صفوف وأعمدة ثابتة = غير منظمة."],

[4,"A company makes sure its chatbot never shares one customer's data with another. Which dimension is this?","شركة تتأكد أن الـ chatbot ما يشارك بيانات عميل مع عميل ثاني أبدًا. أي بُعد هذا؟","privacy",["fairness","sustainability","transparency"],"Protecting personal data = privacy and security.","حماية البيانات الشخصية = Privacy."],
[4,"A team adds the ability to monitor, override and shut down an AI system's behavior. Which dimension is this?","فريق يضيف قدرة مراقبة وتجاوز وإيقاف سلوك نظام AI. أي بُعد هذا؟","controllability",["fairness","transparency","sustainability"],"Steering and overriding = controllability.","التوجيه والتجاوز = Controllability."],
[4,"An organization sets policies, review boards and accountability for every AI project. Which dimension is this?","منظمة تضع سياسات ولجان مراجعة ومسؤوليات لكل مشروع AI. أي بُعد هذا؟","governance",["robustness","explainability","sustainability"],"Policies and accountability = governance.","سياسات ومسؤولية = Governance."],
[4,"Which service measures pre-training bias, such as class imbalance in a dataset?","أي خدمة تقيس التحيز قبل التدريب مثل عدم توازن الفئات في الـ dataset؟","clarify",["guardrails","modelmonitor","macie"],"Data bias metrics = Clarify.","مقاييس تحيز البيانات = Clarify."],
[4,"Which service can continuously monitor a deployed model for bias drift over time, together with Clarify?","أي خدمة تراقب النموذج المنشور باستمرار للـ bias drift مع الوقت، بالتعاون مع Clarify؟","modelmonitor",["artifact","polly","groundtruth"],"Model Monitor + Clarify = bias drift monitoring.","Model Monitor + Clarify = مراقبة تغيّر التحيز."],
[4,"A company wants to filter hate, insults, sexual content and violence in both user prompts and model responses. Which feature fits?","شركة تبي تفلتر الكراهية والإهانات والمحتوى الجنسي والعنف في الـ prompts والردود. أي ميزة تناسب؟","guardrails",["clarify","modelcards","kms"],"Content filters = Guardrails.","فلاتر المحتوى = Guardrails."],
[4,"A company wants to block a list of specific profane words and competitor names in chatbot outputs. Which Guardrails feature fits?","شركة تبي تمنع قائمة كلمات بذيئة وأسماء منافسين في ردود الـ chatbot. أي ميزة في Guardrails تناسب؟","L:Word filters|فلاتر الكلمات (Word filters)",["L:Contextual grounding check|Contextual grounding check","L:Automated Reasoning checks|Automated Reasoning","L:Model Cards|Model Cards"],"Exact words = word filters.","كلمات محددة = Word filters."],
[4,"Where can a customer read AWS's own documentation about the intended uses, limitations and responsible design of services like Rekognition?","وين تقرأ العميلة توثيق AWS نفسها عن استخدامات وحدود وتصميم خدمات مثل Rekognition؟","servicecards",["modelcards","artifact","cloudtrail"],"AWS's services = AI Service Cards; your models = Model Cards.","خدمات AWS = AI Service Cards؛ نماذجك = Model Cards."],
[4,"Which is the main tradeoff between interpretability and performance?","وش الموازنة الأساسية بين قابلية التفسير والأداء؟","L:Simpler models (like linear models or decision trees) are easier to explain but may be less accurate than deep models|النماذج البسيطة أسهل تفسيرًا لكن ممكن أقل دقة من النماذج العميقة",["L:Deep models are always easier to explain|النماذج العميقة دايمًا أسهل تفسيرًا","L:There is no tradeoff|ما فيه موازنة","L:Interpretability only matters for images|التفسير مهم للصور فقط"],"More complex = often more accurate, less explainable.","أعقد = غالبًا أدق وأصعب تفسيرًا."],
[4,"A regulator requires decisions that can be fully explained. Which model choice is often preferred?","جهة تنظيمية تطلب قرارات قابلة للتفسير بالكامل. أي اختيار نموذج غالبًا يُفضَّل؟","L:A simpler, interpretable model such as a decision tree|نموذج أبسط وقابل للتفسير مثل decision tree",["L:The largest LLM available|أكبر LLM متاح","L:A diffusion model|نموذج diffusion","L:A GAN|GAN"],"Interpretable by design when explanation is mandatory.","قابل للتفسير بطبيعته لما التفسير إلزامي."],
[4,"Which method explains how much each input feature contributed to a single prediction?","أي طريقة تفسر كم كل feature ساهمت في توقع واحد؟","L:SHAP values|قيم SHAP",["bleu","rouge","L:Prompt caching|Prompt caching"],"SHAP (used by Clarify) = feature attribution.","SHAP (يستخدمه Clarify) = إسناد الـ features."],
[4,"A face recognition system works well for adults but poorly for teenagers, who were rare in the training data. What caused this?","نظام تعرف على الوجوه يشتغل كويس مع الكبار وضعيف مع المراهقين اللي كانوا قليلين في بيانات التدريب. وش السبب؟","L:Sampling bias from unrepresentative training data|تحيز في العينة بسبب بيانات تدريب غير ممثلة",["L:Too much temperature|temperature عالية","L:Prompt injection|Prompt injection","L:Model is too small for its GPU|النموذج صغير على الـ GPU"],"Unrepresentative data → biased results.","بيانات غير ممثلة ← نتائج متحيزة."],
[4,"Which TWO are characteristics of a responsible dataset? (Select TWO.)","أي خاصيتين للـ dataset المسؤولة؟ (اختاري اثنتين)",["L:Inclusive and diverse|شاملة ومتنوعة","L:Balanced and curated|متوازنة ومنقحة"],["L:As small as possible|أصغر ما يمكن","L:Collected without consent|مجمعة بدون موافقة","L:Never reviewed|ما تمت مراجعتها"],"Inclusive, diverse, balanced, curated data sources.","بيانات شاملة ومتنوعة ومتوازنة ومنقحة."],
[4,"Which legal risk is specific to generative AI content?","أي خطر قانوني خاص بمحتوى الـ GenAI؟","ip",["drift","underfit","L:Slow latency|بطء الاستجابة"],"Outputs may infringe intellectual property.","المخرجات ممكن تنتهك الملكية الفكرية."],
[4,"A chatbot gives a customer wrong medical advice and the customer is harmed. Which risk is this?","chatbot أعطى عميل نصيحة طبية غلط وتضرر. وش هذا الخطر؟","L:End-user risk and loss of customer trust|خطر على المستخدم وفقدان ثقة العملاء",["L:Data drift only|Data drift فقط","L:A token limit|حد الـ tokens","L:A billing error|خطأ فواتير"],"Harm to users and trust are listed GenAI risks.","الضرر على المستخدم والثقة من مخاطر GenAI."],
[4,"Which practice reduces the risk of biased outputs from a GenAI app?","أي ممارسة تقلل خطر الردود المتحيزة في تطبيق GenAI؟","L:Evaluate outputs across different groups, use Guardrails and keep humans reviewing|تقييم الردود عبر فئات مختلفة واستخدام Guardrails ومراجعة بشرية",["L:Raise temperature|رفع temperature","L:Remove all monitoring|إيقاف كل المراقبة","L:Use the largest model only|استخدام أكبر نموذج فقط"],"Test, filter and review.","اختبري وفلتري وراجعي."],
[4,"Which statement about human audits of AI systems is correct?","أي عبارة صحيحة عن التدقيق البشري لأنظمة AI؟","L:Regular human audits help catch bias, errors and misuse that metrics miss|التدقيق البشري المنتظم يلقط التحيز والأخطاء وسوء الاستخدام اللي تفوّته المقاييس",["L:They are never needed with GenAI|ما تحتاجها مع GenAI أبدًا","L:They replace all automated testing|تستبدل كل الاختبارات الآلية","L:They are only for image models|للصور فقط"],"Humans complement automated checks.","البشر يكملون الفحوصات الآلية."],
[4,"A company wants to reduce the carbon footprint of its AI workloads. Which choice helps most?","شركة تبي تقلل البصمة الكربونية لأحمال الـ AI. أي اختيار يساعد أكثر؟","L:Use right-sized models and efficient hardware like AWS Trainium and Inferentia|استخدام نماذج بحجم مناسب وأجهزة كفؤة مثل Trainium وInferentia",["L:Always use the largest model|استخدام أكبر نموذج دايمًا","L:Retrain daily without need|إعادة التدريب يوميًا بدون حاجة","L:Keep idle GPUs running|خلي الـ GPUs تشتغل وهي فاضية"],"Sustainability = efficiency.","الاستدامة = الكفاءة."],
[4,"What does 'veracity' mean in responsible AI?","وش يعني veracity في Responsible AI؟","L:Producing truthful, accurate outputs|إنتاج مخرجات صادقة ودقيقة",["L:Producing outputs faster|إنتاج مخرجات أسرع","L:Using fewer tokens|استخدام tokens أقل","L:Encrypting outputs|تشفير المخرجات"],"Veracity = truthfulness.","Veracity = الصدق والدقة."],
[4,"A team documents a model's training data sources, evaluation results and ethical considerations for auditors. Which tool fits?","فريق يوثق مصادر بيانات التدريب ونتائج التقييم والاعتبارات الأخلاقية للمدققين. أي أداة تناسب؟","modelcards",["groundtruth","polly","caching"],"Documentation = Model Cards.","التوثيق = Model Cards."],
[4,"A content moderation pipeline uses Rekognition, but borderline images must be checked by people. Which service adds this?","نظام فلترة محتوى يستخدم Rekognition، لكن الصور الحدّية لازم يشوفها بشر. أي خدمة تضيف هذا؟","a2i",["groundtruth","macie","inspector"],"Human review = A2I.","مراجعة بشرية = A2I."],
[4,"Which is an example of an inclusive design practice for an AI voice assistant?","أي مثال على التصميم الشامل لمساعد صوتي؟","L:Testing with speakers of different accents, ages and speech patterns|الاختبار مع متحدثين بلهجات وأعمار وأنماط كلام مختلفة",["L:Testing only with the development team|الاختبار مع فريق التطوير فقط","L:Supporting one accent only|دعم لهجة وحدة فقط","L:Skipping evaluation|تخطي التقييم"],"Diverse testing reduces bias.","الاختبار المتنوع يقلل التحيز."],
[4,"What does it mean for an AI system to be 'safe'?","وش يعني أن نظام AI «آمن» (safe)؟","safety",["L:It is the fastest|الأسرع","L:It uses the least storage|يستخدم أقل تخزين","L:It has the most parameters|فيه أكثر parameters"],"Safety = avoiding harmful outputs and misuse.","Safety = تجنب المخرجات الضارة وسوء الاستخدام."],
[4,"A model's toxicity score must be measured before launch. Which TWO tools can evaluate this? (Select TWO.)","لازم تنقاس درجة السمّية للنموذج قبل الإطلاق. أي أداتين تقدر تقيّم هذا؟ (اختاري اثنتين)",["bedrockeval","clarify"],["artifact","polly","kms"],"Both Bedrock evaluation and Clarify FM evaluation cover toxicity.","تقييم Bedrock وتقييم Clarify للنماذج يشملون السمّية."],
[4,"An AI system's decisions affect people's access to housing. What should the company do first?","قرارات نظام AI تأثر على حصول الناس على سكن. وش أول شي تسويه الشركة؟","L:Assess risks and bias, ensure explainability, and keep human oversight|تقييم المخاطر والتحيز وضمان التفسير والإشراف البشري",["L:Launch quickly and fix later|الإطلاق بسرعة والتصليح بعدين","L:Hide the model's logic|إخفاء منطق النموذج","L:Remove the appeals process|إلغاء عملية الاعتراض"],"High-impact decisions need extra safeguards.","القرارات المؤثرة تحتاج ضمانات أكثر."],
[4,"Which is a transparency practice for GenAI applications?","أي ممارسة شفافية لتطبيقات GenAI؟","L:Clearly telling users they are interacting with AI and that answers may contain errors|إخبار المستخدم بوضوح أنه يتعامل مع AI وأن الأجوبة ممكن فيها أخطاء",["L:Pretending the AI is a human|التظاهر أن الـ AI إنسان","L:Hiding the data sources|إخفاء مصادر البيانات","L:Disabling feedback|إيقاف الملاحظات"],"Disclose AI use and limitations.","وضّحي استخدام الـ AI وحدوده."],
[4,"Which feature of Guardrails helps keep RAG answers honest about their sources?","أي ميزة في Guardrails تساعد أجوبة RAG تكون صادقة مع مصادرها؟","L:Contextual grounding check|Contextual grounding check",["L:Word filters|Word filters","L:Denied topics|Denied topics","L:Prompt caching|Prompt caching"],"Grounding + relevance scores.","درجات الـ grounding والصلة."],
[4,"A dataset includes people's photos collected without consent. Which concern is this?","dataset فيها صور ناس مجمعة بدون موافقتهم. وش هذا القلق؟","L:Privacy and legal/ethical data sourcing|الخصوصية ومصدر البيانات القانوني والأخلاقي",["L:Underfitting|Underfitting","L:Latency|Latency","L:Token pricing|تسعير الـ tokens"],"Data must be collected lawfully and ethically.","البيانات لازم تُجمع بشكل قانوني وأخلاقي."],
[4,"Which statement about bias and variance is correct?","أي عبارة صحيحة عن bias وvariance؟","L:High variance means overfitting; high bias means underfitting|High variance يعني Overfitting؛ High bias يعني Underfitting",["L:High bias means overfitting|High bias يعني Overfitting","L:They are the same thing|نفس الشي","L:They only apply to LLMs|تنطبق على LLMs فقط"],"Variance = sensitive to training data; bias = too simple.","Variance = حساس لبيانات التدريب؛ Bias = بسيط زيادة."],
[4,"Which group of tools supports responsible AI on AWS?","أي مجموعة أدوات تدعم Responsible AI على AWS؟","L:Bedrock Guardrails, SageMaker Clarify, Model Monitor, A2I and Model Cards|Bedrock Guardrails وClarify وModel Monitor وA2I وModel Cards",["L:CloudFront, Route 53 and S3 Glacier|CloudFront وRoute 53 وGlacier","L:EC2, EBS and VPC only|EC2 وEBS وVPC فقط","L:SES, SNS and SQS|SES وSNS وSQS"],"These are the in-scope responsible AI tools.","هذي أدوات Responsible AI ضمن النطاق."],
[4,"A model's answers are accurate but sometimes reveal private customer details. Which Guardrails feature should be configured?","أجوبة النموذج دقيقة لكن أحيانًا تكشف تفاصيل خاصة للعملاء. أي ميزة في Guardrails لازم تُضبط؟","L:Sensitive information filters (PII masking or blocking)|فلاتر المعلومات الحساسة (إخفاء أو منع PII)",["L:Denied topics only|Denied topics فقط","L:Word filters for profanity|فلاتر الشتائم","L:Prompt Management|Prompt Management"],"PII in outputs = sensitive information filters.","PII في الردود = فلاتر المعلومات الحساسة."],
[4,"An image generator often shows only men when asked for 'a doctor'. Which issue is this?","مولّد صور غالبًا يطلع رجال فقط لما نطلب «طبيب». وش هذي المشكلة؟","L:Bias in generated outputs reflecting skewed training data|تحيز في المخرجات بسبب بيانات تدريب منحازة",["L:Overfitting to a test set|Overfitting على الـ test set","L:Prompt leaking|Prompt leaking","L:Low token limit|حد tokens منخفض"],"Stereotypes in data appear in outputs.","الصور النمطية في البيانات تظهر في المخرجات."],
[4,"Which is the best way to handle a GenAI tool that might produce copyrighted text?","وش أفضل طريقة للتعامل مع أداة GenAI ممكن تنتج نص محمي بحقوق نشر؟","L:Review outputs, set clear usage policies and prefer providers with IP indemnity|مراجعة المخرجات ووضع سياسات استخدام واضحة وتفضيل مزودين يقدمون حماية للملكية الفكرية",["L:Publish everything without review|نشر كل شي بدون مراجعة","L:Remove the AI disclaimer|حذف تنبيه الـ AI","L:Raise temperature|رفع temperature"],"Human review + policy + indemnity.","مراجعة بشرية + سياسة + حماية."],
[4,"Which metric family in Clarify compares outcomes between groups, such as approval rates for two age ranges?","أي نوع مقاييس في Clarify يقارن النتائج بين الفئات مثل نسب الموافقة لفئتين عمريتين؟","L:Post-training bias metrics (e.g. difference in positive proportions)|مقاييس التحيز بعد التدريب (مثل الفرق في نسب القبول)",["rouge","bleu","perplexity"],"Clarify computes pre- and post-training bias metrics.","Clarify يحسب مقاييس التحيز قبل وبعد التدريب."],
[4,"Why is diverse human feedback important when using RLHF?","ليش الملاحظات البشرية المتنوعة مهمة في RLHF؟","L:So the model aligns with a broad range of values rather than one narrow group|عشان النموذج يتوافق مع قيم متنوعة مو فئة وحدة ضيقة",["L:To reduce token cost|لتقليل تكلفة الـ tokens","L:To speed up inference|لتسريع الاستدلال","L:To shrink the model|لتصغير النموذج"],"Narrow feedback = narrow bias.","ملاحظات ضيقة = تحيز ضيق."],
[4,"A company launches an AI feature. What should it monitor continuously after launch for responsible AI?","شركة أطلقت ميزة AI. وش لازم تراقب باستمرار بعد الإطلاق؟","L:Quality, bias, harmful outputs and user feedback|الجودة والتحيز والمخرجات الضارة وملاحظات المستخدمين",["L:Only the AWS bill|فاتورة AWS فقط","L:Only CPU usage|استخدام الـ CPU فقط","L:Nothing; launch is the end|ولا شي؛ الإطلاق هو النهاية"],"Responsible AI is ongoing.","الـ Responsible AI مستمر."],
[4,"Which practice best supports explainability for an LLM-based decision assistant?","أي ممارسة تدعم التفسير لمساعد قرارات مبني على LLM؟","L:Show the sources and reasoning used for each answer|عرض المصادر والتبرير المستخدم في كل جواب",["L:Hide the prompt and sources|إخفاء الـ prompt والمصادر","L:Increase randomness|زيادة العشوائية","L:Remove logs|حذف السجلات"],"Citations and rationales aid explanation.","المصادر والتبرير يساعدون في التفسير."],
[4,"A model trained mainly on English data is used for Arabic customers and performs worse. Which responsible AI concern is this?","نموذج متدرب غالبًا على بيانات إنجليزية يُستخدم لعملاء عرب وأداؤه أضعف. أي قلق في Responsible AI هذا؟","fairness",["sustainability","L:Prompt caching|Prompt caching","L:Provisioned Throughput|Provisioned Throughput"],"Unequal performance across groups = fairness.","أداء غير متساوي بين الفئات = Fairness."],
[4,"Which statement describes 'responsible AI' best?","أي عبارة تصف Responsible AI أفضل؟","L:Designing, building and using AI that is fair, safe, transparent, private and accountable|تصميم وبناء واستخدام AI عادل وآمن وشفاف ويحمي الخصوصية وقابل للمساءلة",["L:Using AI only on weekends|استخدام الـ AI بنهاية الأسبوع فقط","L:Using the most expensive model|استخدام أغلى نموذج","L:Avoiding all automation|تجنب كل الأتمتة"],"A full-lifecycle practice.","ممارسة على كامل دورة الحياة."],

[5,"A company must prove that every S3 bucket with training data has encryption turned on, and see when that setting changed. Which service fits?","شركة لازم تثبت أن كل S3 bucket فيه بيانات تدريب مشفر، وتعرف متى تغيّر هذا الإعداد. أي خدمة تناسب؟","config",["cloudtrail","cloudwatch","trusted"],"Configuration compliance and history = Config.","امتثال الإعدادات وتاريخها = Config."],

[5,"A customer needs AWS's ISO 42001 (AI management) certification report for a vendor review. Where can it be downloaded?","عميلة تحتاج تقرير شهادة ISO 42001 (إدارة AI) من AWS لمراجعة مورد. من وين تنزله؟","artifact",["auditmgr","config","cloudtrail"],"AWS's compliance reports = Artifact.","تقارير امتثال AWS = Artifact."],
[5,"A company wants AWS to continuously collect evidence that its own controls meet a generative AI best-practices framework. Which service fits?","شركة تبي AWS يجمع باستمرار أدلة أن ضوابطها هي تحقق إطار أفضل ممارسات GenAI. أي خدمة تناسب؟","auditmgr",["artifact","trusted","inspector"],"Your evidence = Audit Manager.","أدلتك أنتِ = Audit Manager."],

/* ---------- QUESTION RENDERER ---------- */
function hint(q){return t({s:"q_single",m:"q_multi",o:"q_order",x:"q_match"}[q.t])}
function mountQ(q,box,state){
 /* state: {perm, sel:[], order:[], match:[]} persisted by caller */
 if(!state.perm){
  if(q.t==="s"||q.t==="m")state.perm=shuffle(q.o.map((_,i)=>i));
  if(q.t==="o"){state.perm=shuffle(q.o.map((_,i)=>i));state.order=state.perm.slice()}
  if(q.t==="x"){state.perm=shuffle(q.o.map((_,i)=>i));state.match=q.o.map(()=>-1)}
  state.sel=state.sel||[];
 }
 const L8="ABCDEFGH";
 const draw=()=>{let h="";
  if(q.t==="s"||q.t==="m")h=`<div class="opts">${state.perm.map((oi,k)=>`<button class="opt" type="button" data-oi="${oi}" aria-pressed="${state.sel.includes(oi)}"><span class="k">${L8[k]}</span><span>${optHTML(q,oi)}<span class="note" hidden></span></span></button>`).join("")}</div>`;
  if(q.t==="o")h=`<div class="ord">${state.order.map((oi,k)=>`<div class="ord-item" data-oi="${oi}"><span class="k">${k+1}</span><span>${optHTML(q,oi)}</span><span class="mv"><button type="button" data-mv="-1" data-k="${k}" aria-label="up">▲</button><button type="button" data-mv="1" data-k="${k}" aria-label="down">▼</button></span></div>`).join("")}</div>`;
  if(q.t==="x")h=`<div class="match">${q.o.map((p,i)=>`<div class="match-row" data-i="${i}"><b>${esc(p[0])}</b><select id="m-${q.id}-${i}" data-i="${i}"><option value="-1">—</option>${state.perm.map(pi=>`<option value="${pi}" ${state.match[i]===pi?"selected":""}>${esc(optPlain(q,pi,q.o[pi][1]))}</option>`).join("")}</select></div>`).join("")}</div>`;
  box.innerHTML=h};
 draw();
 box.onclick=e=>{if(state.locked)return;const o=e.target.closest(".opt");if(o){const oi=+o.dataset.oi;
   if(q.t==="s")state.sel=[oi];else{state.sel=state.sel.includes(oi)?state.sel.filter(x=>x!==oi):state.sel.concat(oi);if(state.sel.length>q.a.length)state.sel.shift()}
   draw();state.onChange&&state.onChange();return}
  const m=e.target.closest("[data-mv]");if(m){const k=+m.dataset.k,d=+m.dataset.mv,j=k+d;if(j<0||j>=state.order.length)return;[state.order[k],state.order[j]]=[state.order[j],state.order[k]];state.touched=true;draw();state.onChange&&state.onChange()}};
 box.onchange=e=>{if(state.locked)return;const s=e.target.closest("select");if(s){state.match[+s.dataset.i]=+s.value;state.onChange&&state.onChange()}};
 return{
  answered:()=>q.t==="s"||q.t==="m"?state.sel.length===q.a.length:q.t==="o"?!!state.touched:state.match.every(v=>v>=0),
  correct:()=>isCorrect(q,state),
  reveal:(withNotes)=>{state.locked=true;
   if(q.t==="s"||q.t==="m")$$(".opt",box).forEach(b=>{const oi=+b.dataset.oi,ok=q.a.includes(oi),picked=state.sel.includes(oi);if(ok)b.classList.add("right");else if(picked)b.classList.add("wrong");
     if(withNotes){const h=noteHTML(q,oi);if(h){const n=$(".note",b);n.hidden=false;n.innerHTML=h}}});
   if(q.t==="o")$$(".ord-item",box).forEach((r,k)=>{const ok=+r.dataset.oi===k;r.classList.add(ok?"right":"wrong");if(!ok){r.insertAdjacentHTML("beforeend",`<span class="note muted" style="grid-column:2;font-size:13px">→ #${(+r.dataset.oi)+1}</span>`)}$$("button",r).forEach(b=>b.disabled=true)});
   if(q.t==="x")$$(".match-row",box).forEach(r=>{const i=+r.dataset.i,ok=state.match[i]===i;r.classList.add(ok?"right":"wrong");$("select",r).disabled=true;if(!ok)r.insertAdjacentHTML("beforeend",`<span style="grid-column:1/-1;font-size:13px;color:var(--good)">✓ ${esc(optPlain(q,i,q.o[i][1]))}</span>`)})
  }}}
function isCorrect(q,s){if(q.t==="s"||q.t==="m")return s.sel.length===q.a.length&&q.a.every(a=>s.sel.includes(a));
 if(q.t==="o")return s.order.every((oi,k)=>oi===k);if(q.t==="x")return s.match.every((v,i)=>v===i);return false}

let qDom=0,qMode="sets",qCur=null,qState=null,qDone=false,qSet=null;
const SET_SIZE=20;
function setsFor(d){const qs=QUESTIONS.filter(q=>q.d===d),out=[];const n=Math.ceil(qs.length/SET_SIZE),sz=Math.ceil(qs.length/n);for(let i=0;i<qs.length;i+=sz)out.push(qs.slice(i,i+sz));return out}
function pool(){let p=QUESTIONS.filter(q=>!qDom||q.d===qDom);if(qMode==="new")p=p.filter(q=>!S.ans[q.id]);if(qMode==="mist")p=p.filter(q=>S.mist.includes(q.id));return p}

 const p=pool();qDone=false;qState={};if(!p.length){qCur=null}else{const others=p.filter(q=>!qCur||q.id!==qCur.id);const src=others.length?others:p;qCur=src[Math.floor(Math.random()*src.length)]}renderQuiz()}
function renderSets(box){const doms=qDom?[qDom]:[1,2,3,4,5];
 box.innerHTML=`<p class="lead" style="margin-bottom:14px">${t("sets_lead",{n:QUESTIONS.length})}</p><div class="view">${doms.map(d=>`<div class="sets-dom"><h3><span class="dtag" style="--dc:var(--d${d})">D${d}</span><bdi>${esc(tx(DOMS[d]))}</bdi> <span class="mono muted" style="font-size:12px">${QUESTIONS.filter(q=>q.d===d).length}</span></h3><div class="set-grid">${setsFor(d).map((s,k)=>{const ok=s.filter(q=>S.ans[q.id]&&S.ans[q.id].ok).length;return`<button class="set-btn${ok===s.length?" full":""}" type="button" data-set-d="${d}" data-set-k="${k}" style="--dc:var(--d${d})"><b>${t("set_n",{n:k+1})}</b><span>${ok} / ${s.length}</span><i><em style="width:${ok/s.length*100}%"></em></i></button>`}).join("")}</div></div>`).join("")}</div>`}
function renderQuiz(){renderQuizChrome();const box=$("#quizBox");
 if(qMode==="sets"&&!qSet){renderSets(box);return}
 if(qMode==="sets"&&qSet.done){box.innerHTML=`<div class="panel" style="display:grid;gap:12px;justify-items:center;text-align:center"><span class="eyebrow">D${qSet.d} · ${t("set_n",{n:qSet.k+1})}</span><h3 style="font-size:22px">${t("set_done")}</h3><div class="result-big ${qSet.ok/qSet.qs.length>=.7?"pass":"fail"}">${qSet.ok}/${qSet.qs.length}</div><div class="row" style="justify-content:center">${setsFor(qSet.d)[qSet.k+1]?`<button class="btn" type="button" data-set-d="${qSet.d}" data-set-k="${qSet.k+1}">${t("next_set")}</button>`:""}<button class="btn ghost" type="button" data-set-d="${qSet.d}" data-set-k="${qSet.k}">${t("retry_set")}</button><button class="btn ghost" type="button" data-back-sets="1">${t("back_sets")}</button></div></div>`;if(qSet.ok/qSet.qs.length>=.7)confetti(90);return}
 if(!qCur){box.innerHTML=`<div class="empty">${qMode==="mist"?t("no_mist"):t("no_q")}</div>`;return}
 const q=qCur;
 box.innerHTML=`<div class="panel q-card"><div class="q-meta"><span class="dtag" style="--dc:var(--d${q.d})">D${q.d} · <bdi>${esc(tx(DOMS[q.d]))}</bdi></span><span class="q-id">${qSet?`${t("set_n",{n:qSet.k+1})} · ${t("q_of",{a:qSet.i+1,b:qSet.qs.length})}`:esc(q.id)}</span></div>${qSet?`<div><button class="chip" type="button" data-back-sets="1">${t("back_sets")}</button></div>`:""}${qTextHTML(q)}<p class="q-hint">${hint(q)}</p><div id="qBody"></div><div id="qFb"></div><div class="qbar"><span></span><button class="btn" id="qBtn" type="button" disabled>${t("check")}</button></div></div>`;
 const btn=$("#qBtn");qState.onChange=()=>{btn.disabled=!ctl.answered()};
 const ctl=mountQ(q,$("#qBody"),qState);if(q.t==="o")btn.disabled=false;
 const showFb=ok=>{$("#qFb").innerHTML=`<div class="feedback ${ok?"ok":"no"}"><h4>${ok?t("right"):t("wrong")}</h4><p${L==="ar"?' dir="rtl"':""}><b>${t("why")}:</b> ${esc(L==="ar"?q.ar:q.en)}</p>${L==="ar"&&QL()!=="ar"?`<p class="muted" style="font-size:13px;direction:ltr;text-align:left">${esc(q.en)}</p>`:""}</div>`;btn.textContent=t("next");btn.disabled=false};
 if(qDone){ctl.reveal(true);showFb(qState.result)}
 btn.onclick=()=>{if(qDone){nextQ();return}qState.touched=true;const ok=ctl.correct();ctl.reveal(true);qDone=true;qState.result=ok;
  const first=!S.ans[q.id];S.ans[q.id]={ok,t:Date.now()};
  if(qSet&&ok)qSet.ok++;
  if(ok){S.mist=S.mist.filter(x=>x!==q.id);addXP(first?10:5);toast(t("toast_xp",{n:first?10:5}));confetti(40)}else{if(!S.mist.includes(q.id))S.mist.push(q.id);addXP(2)}save();
  showFb(ok);renderQuizChrome()};
}

 return{qs:shuffle(qs).map(q=>q.id),st:{},flags:[],i:0,end:Date.now()+90*60e3,done:false}}

 <div class="panel"><div class="grid-nav" id="mGrid"></div></div><div id="mConfirm"></div><div><button class="btn ghost" id="mQuit" type="button">${t("abandon")}</button></div>`;
 const st=M.st[id];st.onChange=()=>{st.touched=true;drawGrid()};const ctl=mountQ(q,$("#mBody"),st);st.ctl=ctl;

 $("#mSubmit").onclick=()=>{const un=M.qs.filter(qid=>{const s=M.st[qid];return!(s&&s.perm&&isAnswered(mockQ(qid),s))}).length;
  if(!un){finishMock();return}
  $("#mConfirm").innerHTML=`<div class="feedback no"><p>${t("mock_confirm")} (${un})</p><div class="row"><button class="btn" id="mYes" type="button">${t("mock_yes")}</button><button class="btn ghost" id="mNo" type="button">${t("mock_no")}</button></div></div>`;
  $("#mYes").onclick=finishMock;$("#mNo").onclick=()=>{$("#mConfirm").innerHTML=""};$("#mConfirm").scrollIntoView({block:"center"})};
 const tk=()=>{const ms=Math.max(0,M.end-Date.now());const el=$("#mTime");if(!el)return;el.textContent=String(Math.floor(ms/6e4)).padStart(2,"0")+":"+String(Math.floor(ms/1e3)%60).padStart(2,"0");el.classList.toggle("low",ms<10*6e4);if(!ms)finishMock()};
 tk();mTimer=setInterval(tk,1000);
}
function isAnswered(q,s){return q.t==="s"||q.t==="m"?(s.sel||[]).length===q.a.length:q.t==="o"?!!s.touched:(s.match||[]).every(v=>v>=0)}
function finishMock(){clearInterval(mTimer);const by={};let ok=0;
 M.qs.forEach(id=>{const q=mockQ(id),s=M.st[id]||{};const good=s.perm?isCorrect(q,s):false;s.good=good;by[q.d]=by[q.d]||{ok:0,n:0};by[q.d].n++;if(good){by[q.d].ok++;ok++}
  if(!good&&!S.mist.includes(id))S.mist.push(id);if(s.perm)S.ans[id]={ok:good,t:Date.now()}});
 const score=Math.round(100+900*ok/M.qs.length);M.done=true;M.score=score;M.by=by;M.ok=ok;
 S.mocks.push({score,date:new Date().toLocaleString(L==="ar"?"ar-SA-u-ca-gregory":"en-US",{dateStyle:"medium",timeStyle:"short"}),by});addXP(50+ok);save();
 if(score>=700)confetti(140);renderMock()}
function renderResult(){const box=$("#mockBox"),pass=M.score>=700;
 box.innerHTML=`<div class="panel" style="display:grid;gap:12px;text-align:center;justify-items:center"><span class="eyebrow">${pass?t("passed"):t("failed")}</span><div class="result-big ${pass?"pass":"fail"}">${M.score}</div><span class="mono muted">${M.ok} / ${M.qs.length} · pass = 700</span></div>
 <div class="panel"><h3 style="font-size:17px;margin-bottom:12px">${t("per_dom")}</h3><div class="domains">${Object.keys(M.by).sort().map(d=>{const b=M.by[d],pc=Math.round(b.ok/b.n*100);return`<div class="dom" style="--dc:var(--d${d})"><span class="dtag" style="--dc:var(--d${d})">D${d}</span><span class="nm">${esc(tx(DOMS[d]))}</span><span class="pct">${b.ok}/${b.n}</span><div class="bar2"><i style="width:${pc}%"></i></div></div>`}).join("")}</div></div>
 <div class="panel"><h3 style="font-size:17px;margin-bottom:10px">${t("review")}</h3><div class="grid-nav" id="rGrid">${M.qs.map((id,k)=>`<button type="button" data-k="${k}" class="${M.st[id]&&M.st[id].good?"r-ok":"r-no"}">${k+1}</button>`).join("")}</div><div id="rBox" style="margin-top:14px"></div></div>
 <div class="row"><button class="btn spark" id="mAgain" type="button">${t("again")}</button><button class="btn ghost" type="button" data-go="quiz">${t("mode_mist")}</button></div>`;
 $("#mAgain").onclick=()=>{M=buildMock();renderMock()};
 $("#rGrid").onclick=e=>{const b=e.target.closest("[data-k]");if(!b)return;const id=M.qs[+b.dataset.k],q=mockQ(id),s=M.st[id]||{};const st={perm:s.perm,sel:(s.sel||[]).slice(),order:(s.order||[]).slice(),match:(s.match||[]).slice()};
  $("#rBox").innerHTML=`<div class="q-card">${qTextHTML(q)}<div id="rBody"></div><div class="feedback ${s.good?"ok":"no"}"><p>${esc(L==="ar"?q.ar:q.en)}</p></div></div>`;
  const ctl=mountQ(q,$("#rBody"),st);ctl.reveal(true)};
}

/* ---------- FLASHCARDS (Leitner) ---------- */
const FC=SERVICES.map(s=>({id:"s:"+s.n,f:s.n,k:"service",ar:s.ar,en:s.en})).concat(TERMS.map(x=>({id:"t:"+x[0],f:x[0],k:"concept",ar:x[1],en:x[2]})));
const GAP=[0,1,2,4,7,14];
let fcCur=null;
function fcDue(){const now=Date.now();return FC.filter(c=>{const s=S.fc[c.id];return!s||s.due<=now})}
function renderCards(){const due=fcDue();$("#fcDue").textContent=due.length+" "+t("fc_due");
 const counts=[1,2,3,4,5].map(b=>FC.filter(c=>(S.fc[c.id]?S.fc[c.id].box:1)===b).length);
 $("#fcBoxes").innerHTML=counts.map((n,i)=>`<div><b>${n}</b>${t("fc_box")} ${i+1}</div>`).join("");
 const fc=$("#fc");fc.classList.remove("flip");
 if(!due.length){fcCur=null;$("#fcKind").textContent="";$("#fcFront").textContent=t("fc_done");$("#fcBack").innerHTML="";$("#fcKnow").disabled=$("#fcAgain").disabled=true;return}
 $("#fcKnow").disabled=$("#fcAgain").disabled=false;
 due.sort((a,b)=>((S.fc[a.id]||{box:1}).box-(S.fc[b.id]||{box:1}).box)||Math.random()-.5);fcCur=due[0];
 $("#fcKind").textContent=fcCur.k;$("#fcFront").textContent=fcCur.f;
 $("#fcBack").innerHTML=`<b class="term" style="font-size:18px">${esc(fcCur.f)}</b><span>${esc(L==="ar"?fcCur.ar:fcCur.en)}</span>${L==="ar"?`<span class="en-line">${esc(fcCur.en)}</span>`:""}`;
}
function fcAnswer(know){if(!fcCur)return;const s=S.fc[fcCur.id]||{box:1};s.box=know?Math.min(5,s.box+1):1;s.due=know?Date.now()+GAP[s.box]*864e5-36e5:Date.now()+6e4;S.fc[fcCur.id]=s;addXP(know?2:1);save();renderCards()}
$("#fc").addEventListener("click",()=>$("#fc").classList.toggle("flip"));
$("#fc").addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();$("#fc").classList.toggle("flip")}});
$("#fcKnow").addEventListener("click",()=>fcAnswer(true));$("#fcAgain").addEventListener("click",()=>fcAnswer(false));

/* ---------- KEYWORDS ---------- */
function renderKeys(){const q=$("#kwSearch").value.trim().toLowerCase();
 $("#kwList").innerHTML=KEYWORDS.filter(k=>!q||k.join(" ").toLowerCase().includes(q)).map(k=>`<div class="kwr"><span class="ph">"${esc(k[0])}"</span><span class="arr">${L==="ar"?"←":"→"}</span><span class="ans"><b>${esc(k[1])}</b><small>${esc(L==="ar"?k[2]:"")}</small></span></div>`).join("")||`<div class="empty">—</div>`}
$("#kwSearch").addEventListener("input",renderKeys);

/* ---------- VIDEOS ---------- */
function renderVideos(){$("#vidList").innerHTML=VIDEOS.map(g=>`<div class="set"><div class="set-head"><h3>${esc(tx(g.g))}</h3></div><div class="vids">${g.items.map(v=>`<a class="vid" href="${esc(v.u)}" target="_blank" rel="noopener"><span class="play ${v.yt?"":"doc"}">${v.yt?"▶":"↗"}</span><h4>${esc(L==="ar"?v.ar:v.en)}</h4><p>${esc(L==="ar"?v.dar:v.den)}</p><span class="url">${esc(v.u.replace(/^https:\/\/(www\.)?/,"").slice(0,60))}</span></a>`).join("")}</div></div>`).join("")}

/* ---------- boot ---------- */
function renderAll(){renderHome();renderServices();renderCompare();if(qCur||qMode==="sets")renderQuiz();else nextQ();renderMock();renderCards();renderKeys();renderVideos()}
applyTheme();applyLang();touch();save();renderAll();show(location.hash.slice(1));
})();
</script>
