<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مختبر AIF-C01</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="موقع مذاكرة اختبار AWS Certified AI Practitioner (AIF-C01 v1.1) لأفنان: خطة ٢٢ يوم، بطاقات خدمات، مقارنات، أسئلة سيناريو، اختبار تجريبي، بطاقات تكرار، وفيديوهات.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: sticky console bar + scrollable tab rail; each view is a single column of instrument-like panels. */
:root{
  --bg:#EDF1F3; --surface:#FFFFFF; --sunk:#E3E9EC; --ink:#0F1A22; --muted:#55666F; --line:#D2DBE0;
  --signal:#08826F; --signal-soft:rgba(8,130,111,.10); --on-signal:#FFFFFF;
  --spark:#C97A06; --spark-soft:rgba(242,169,59,.16);
  --good:#16865A; --good-soft:rgba(22,134,90,.11); --bad:#C2363F; --bad-soft:rgba(194,54,63,.10);
  --d1:#2F6FD6; --d2:#8A4FD1; --d3:#08826F; --d4:#C2366F; --d5:#B26A00;
  --shadow:0 1px 0 rgba(15,26,34,.04),0 6px 20px -12px rgba(15,26,34,.25);
  --display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic","Readex Pro",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1116; --surface:#111C23; --sunk:#0D161C; --ink:#E4EDF0; --muted:#8EA2AC; --line:#22323B;
  --signal:#2DD4B8; --signal-soft:rgba(45,212,184,.12); --on-signal:#04211C;
  --spark:#FFB547; --spark-soft:rgba(255,181,71,.13);
  --good:#3DD68C; --good-soft:rgba(61,214,140,.12); --bad:#FF6B72; --bad-soft:rgba(255,107,114,.12);
  --d1:#6EA3FF; --d2:#B88CFF; --d3:#2DD4B8; --d4:#FF7AAE; --d5:#FFB547;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1116; --surface:#111C23; --sunk:#0D161C; --ink:#E4EDF0; --muted:#8EA2AC; --line:#22323B;
  --signal:#2DD4B8; --signal-soft:rgba(45,212,184,.12); --on-signal:#04211C;
  --spark:#FFB547; --spark-soft:rgba(255,181,71,.13);
  --good:#3DD68C; --good-soft:rgba(61,214,140,.12); --bad:#FF6B72; --bad-soft:rgba(255,107,114,.12);
  --d1:#6EA3FF; --d2:#B88CFF; --d3:#2DD4B8; --d4:#FF7AAE; --d5:#FFB547;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--display);line-height:1.3;margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--signal)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:6px}
.en,.mono,code{font-family:var(--mono);direction:ltr;unicode-bidi:isolate}
.term{font-family:var(--body);direction:ltr;unicode-bidi:isolate;font-weight:600}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-row{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.logo{width:34px;height:34px;border-radius:9px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:-.5px;flex:none}
.brand h1{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);direction:ltr;text-align:start}
.xp-chip{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--spark-soft);color:var(--spark);font-family:var(--mono);font-size:12px;font-weight:700;white-space:nowrap}
.icon-btn{display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;height:34px;min-width:34px;padding:0 10px;cursor:pointer;font-weight:600;font-size:13px}
.icon-btn:hover{border-color:var(--signal)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;padding:7px 12px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap}
.tab:hover{color:var(--ink);background:var(--sunk)}
.tab[aria-current="page"]{background:var(--ink);color:var(--bg)}

main{padding-block:22px 60px}
.view{display:grid;gap:18px}
.view[hidden]{display:none!important}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.eyebrow{font-family:var(--body);font-weight:600;font-size:12px;color:var(--muted)}
[dir="ltr"] .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:500}
.sec-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px}
.sec-head h2{font-size:24px}
.lead{color:var(--muted);max-width:68ch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--signal);border-color:var(--signal);color:var(--on-signal)}
.btn{border:0;border-radius:11px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--signal);color:var(--on-signal);font-family:var(--display)}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.spark{background:var(--spark);color:#1A1000}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--muted)}
.dtag{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--sunk)}
.dtag::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--dc,var(--muted))}

/* HERO */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.hero-main{position:relative;overflow:hidden;background:var(--ink);color:var(--bg);border-radius:18px;padding:22px;display:grid;gap:16px;border:0}
.hero-main canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.5;pointer-events:none}
.hero-main > *{position:relative}
.hero-main .eyebrow{color:color-mix(in srgb,var(--bg) 65%,transparent)}
.hero-title{font-size:clamp(24px,4.4vw,36px);font-weight:700}
.hero-title b{color:var(--signal)}
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:440px}
.count div{background:color-mix(in srgb,var(--bg) 9%,transparent);border:1px solid color-mix(in srgb,var(--bg) 16%,transparent);border-radius:12px;padding:10px 6px;text-align:center}
.count b{display:block;font-family:var(--mono);font-size:clamp(24px,5vw,34px);font-variant-numeric:tabular-nums;line-height:1.1}
.count span{font-size:12px;opacity:.75}
.hero-quote{font-family:var(--display);font-size:15px;opacity:.9;max-width:52ch}
.gauge{display:grid;gap:8px}
.gauge-track{position:relative;height:14px;border-radius:99px;background:color-mix(in srgb,var(--bg) 14%,transparent);overflow:visible}
.gauge-fill{position:absolute;inset-block:0;inset-inline-start:0;border-radius:99px;background:linear-gradient(90deg,var(--spark),var(--signal));width:0;transition:width .8s}
[dir="rtl"] .gauge-fill{background:linear-gradient(270deg,var(--spark),var(--signal))}
.gauge-mark{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--bg);inset-inline-start:66.67%}
.gauge-mark::after{content:"700";position:absolute;top:-20px;transform:translateX(50%);font-family:var(--mono);font-size:11px}
[dir="ltr"] .gauge-mark::after{transform:translateX(-50%)}
.gauge-legend{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;opacity:.7}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--sunk);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--mono);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.lvl{display:grid;gap:6px}
.lvl-bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.lvl-bar i{display:block;height:100%;background:var(--spark);width:0;transition:width .6s}
.today{display:grid;gap:10px}
.today h3{font-size:19px}
.day-pill{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--signal);background:var(--signal-soft);padding:3px 10px;border-radius:99px;width:max-content}

.domains{display:grid;gap:12px}
.dom{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center}
.dom .nm{font-weight:600;font-size:14px}
.dom .w{font-family:var(--mono);font-size:12px;color:var(--muted)}
.dom .bar2{grid-column:1/-1;height:10px;border-radius:99px;background:var(--sunk);overflow:hidden;display:flex}
.dom .bar2 i{display:block;height:100%;background:var(--dc);transition:width .6s}
.dom .pct{font-family:var(--mono);font-size:13px;font-weight:700}

.plan{display:grid;gap:4px}
.plan-week{font-family:var(--display);font-weight:700;margin-top:10px;font-size:14px;color:var(--muted)}
.plan-item{display:grid;grid-template-columns:auto auto 1fr;gap:10px;align-items:start;padding:8px 10px;border-radius:10px;cursor:pointer}
.plan-item:hover{background:var(--sunk)}
.plan-item.is-today{background:var(--signal-soft);outline:1px solid var(--signal)}
.plan-item input{width:18px;height:18px;accent-color:var(--signal);margin-top:4px}
.plan-item .dt{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;padding-top:3px;min-width:52px}
.plan-item.done .tx{text-decoration:line-through;color:var(--muted)}

/* SERVICES */
.svc-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1;min-width:200px;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 14px}
.set{display:grid;gap:12px}
.set-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.set-head h3{font-size:18px}
.set-head .tip{font-size:13px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.svc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px;align-content:start;min-width:0}
.svc h4{font-family:var(--body);font-size:16px;direction:ltr;text-align:start;display:flex;align-items:center;gap:8px;justify-content:flex-start}
[dir="rtl"] .svc h4{justify-content:flex-end}
.svc .what{font-size:14px}
.svc .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kw{display:flex;flex-wrap:wrap;gap:5px;direction:ltr}
.kw span{font-family:var(--mono);font-size:11.5px;background:var(--signal-soft);color:var(--signal);padding:2px 8px;border-radius:6px}
.vs{border-top:1px dashed var(--line);padding-top:8px;font-size:13.5px}
.vs b{font-family:var(--body);direction:ltr;unicode-bidi:isolate;color:var(--bad)}
.new-badge{font-family:var(--mono);font-size:10px;background:var(--spark);color:#1A1000;padding:1px 6px;border-radius:5px}

/* TABLES */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th,td{padding:10px 12px;text-align:start;vertical-align:top;border-bottom:1px solid var(--line)}
thead th{background:var(--sunk);font-family:var(--display);font-size:13.5px;position:sticky;top:0}
tbody th{font-weight:700;width:150px}
tr:last-child td,tr:last-child th{border-bottom:0}
td.hl,th.hl{background:var(--signal-soft)}
tbody tr:hover td{background:color-mix(in srgb,var(--signal-soft) 60%,transparent)}
.picker{display:grid;gap:8px}
.picker-out{min-height:44px;padding:10px 14px;border-radius:10px;background:var(--sunk);font-size:14px}

/* QUIZ */
.q-card{display:grid;gap:14px}
.q-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.q-text{font-size:17px;line-height:1.65;direction:ltr;text-align:left;font-family:var(--body)}
.q-hint{font-size:13px;color:var(--muted)}
.q-id{font-family:var(--mono);font-size:12px;color:var(--muted)}
.opts{display:grid;gap:8px;direction:ltr}
.opt{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:11px;padding:11px 12px;cursor:pointer;font-size:15px}
.opt:hover{border-color:var(--signal)}
.opt .k{width:26px;height:26px;border-radius:7px;background:var(--sunk);display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:700}
.opt[aria-pressed="true"]{border-color:var(--signal);background:var(--signal-soft)}
.opt[aria-pressed="true"] .k{background:var(--signal);color:var(--on-signal)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt .note{grid-column:2;font-size:13px;color:var(--muted);display:block;margin-top:4px}
.opt.right .note{color:var(--good)} .opt.wrong .note{color:var(--bad)}
.ord{display:grid;gap:8px;direction:ltr}
.ord-item{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:11px;padding:8px 10px;background:var(--surface)}
.ord-item .k{font-family:var(--mono);font-weight:700;text-align:center}
.ord-item .mv{display:flex;gap:4px}
.ord-item .mv button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);cursor:pointer}
.ord-item.right{border-color:var(--good)} .ord-item.wrong{border-color:var(--bad)}
.match{display:grid;gap:8px;direction:ltr}
.match-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:11px;padding:8px 10px}
@media (max-width:520px){.match-row{grid-template-columns:1fr}}
.match-row select{width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--sunk)}
.match-row.right{border-color:var(--good)} .match-row.wrong{border-color:var(--bad)}
.q-text-ar{font-size:16.5px;line-height:1.8;direction:rtl;text-align:right}
.q-text + .q-text-ar{border-top:1px dashed var(--line);padding-top:10px;color:var(--muted)}
.o-ar{display:block;direction:rtl;text-align:right;font-size:13.5px;color:var(--muted);margin-top:3px}
.o-main-ar{direction:rtl;text-align:right;display:block}
.opt.right .o-ar,.opt.wrong .o-ar{color:inherit;opacity:.8}
.note-ar{display:block;direction:rtl;text-align:right;margin-top:2px}
.sets-dom{display:grid;gap:10px}
.sets-dom h3{font-size:17px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.set-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.set-btn{display:grid;gap:6px;text-align:start;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer}
.set-btn:hover{border-color:var(--signal)}
.set-btn b{font-family:var(--display);font-size:14.5px}
.set-btn span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.set-btn i{display:block;height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.set-btn i em{display:block;height:100%;background:var(--dc)}
.set-btn.full{border-color:var(--good);background:var(--good-soft)}
.set-head-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.feedback{border-radius:12px;padding:14px 16px;display:grid;gap:6px}
.feedback.ok{background:var(--good-soft);border:1px solid var(--good)}
.feedback.no{background:var(--bad-soft);border:1px solid var(--bad)}
.feedback h4{font-size:16px}
.qbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.score-line{font-family:var(--mono);font-size:13px;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:12px}

/* MOCK */
.mock-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;position:sticky;top:calc(env(safe-area-inset-top,0px) + 96px);z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.timer{font-family:var(--mono);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.grid-nav{display:flex;flex-wrap:wrap;gap:5px;direction:ltr}
.grid-nav button{width:34px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-family:var(--mono);font-size:11.5px;cursor:pointer}
.grid-nav button.ans{background:var(--signal-soft);border-color:var(--signal)}
.grid-nav button.flag{box-shadow:inset 0 -3px 0 var(--spark)}
.grid-nav button.cur{background:var(--ink);color:var(--bg)}
.grid-nav button.r-ok{background:var(--good-soft);border-color:var(--good)}
.grid-nav button.r-no{background:var(--bad-soft);border-color:var(--bad)}
.result-big{font-family:var(--mono);font-size:clamp(44px,10vw,72px);font-weight:700;line-height:1}
.pass{color:var(--good)} .fail{color:var(--bad)}

/* FLASHCARDS */
.fc-stage{perspective:1200px;display:grid;place-items:center}
.fc{width:min(560px,100%);height:280px;position:relative;transform-style:preserve-3d;transition:transform .5s;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;padding:24px;display:grid;place-items:center;text-align:center;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);overflow:auto}
.fc-face.back{transform:rotateY(180deg);background:var(--ink);color:var(--bg)}
.fc-front-t{font-family:var(--body);font-weight:700;font-size:clamp(22px,5vw,30px);direction:ltr}
.fc-back-t{font-size:16px;line-height:1.75;display:grid;gap:10px}
.fc-back-t .en-line{font-size:13.5px;opacity:.75;direction:ltr}
.boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center}
.boxes div{background:var(--sunk);border-radius:10px;padding:8px 4px;font-size:12px;color:var(--muted)}
.boxes b{display:block;font-family:var(--mono);font-size:20px;color:var(--ink)}

/* KEYWORDS */
.kws{display:grid;gap:8px}
.kwr{display:grid;grid-template-columns:minmax(0,1.1fr) auto minmax(0,1fr);gap:12px;align-items:center;padding:10px 14px;border-radius:11px;background:var(--surface);border:1px solid var(--line)}
@media (max-width:560px){.kwr{grid-template-columns:1fr}.kwr .arr{display:none}}
.kwr .ph{font-family:var(--mono);font-size:13.5px;direction:ltr;text-align:left}
.kwr .arr{color:var(--signal);font-family:var(--mono)}
.kwr .ans b{color:var(--signal);font-family:var(--body);direction:ltr;unicode-bidi:isolate}
.kwr .ans small{display:block;color:var(--muted);font-size:12.5px}

/* VIDEOS */
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.vid{display:grid;gap:8px;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);align-content:start}
.vid:hover{border-color:var(--signal)}
.vid .play{width:40px;height:28px;border-radius:8px;background:var(--bad);display:grid;place-items:center;color:#fff;font-size:12px}
.vid .play.doc{background:var(--signal);color:var(--on-signal)}
.vid h4{font-size:15px}
.vid p{font-size:13px;color:var(--muted)}
.vid .url{font-family:var(--mono);font-size:11px;color:var(--signal);direction:ltr;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.toast{position:fixed;inset-inline:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:grid;place-items:center;pointer-events:none;z-index:50}
.toast div{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:600;box-shadow:var(--shadow);transform:translateY(20px);opacity:0;transition:.3s}
.toast.show div{transform:none;opacity:1}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;width:100%;height:100%}
footer{color:var(--muted);font-size:13px;padding-block:20px 40px;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:560px){.brand small{display:none}.stats{grid-template-columns:repeat(3,1fr)}.stat b{font-size:20px}.panel{padding:14px}}
</style>
</head>
