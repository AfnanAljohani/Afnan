 const a=Object.values(S.ans);$("#quizScore").textContent=`${a.filter(x=>x.ok).length} ✓ / ${a.length} · ${QUESTIONS.length} total`;
}
function nextQ(){const p=pool();qDone=false;qState={};if(!p.length){qCur=null}else{const others=p.filter(q=>!qCur||q.id!==qCur.id);const src=others.length?others:p;qCur=src[Math.floor(Math.random()*src.length)]}renderQuiz()}
function renderQuiz(){renderQuizChrome();const box=$("#quizBox");
 if(!qCur){box.innerHTML=`<div class="empty">${qMode==="mist"?t("no_mist"):t("no_q")}</div>`;return}
 const q=qCur;
 box.innerHTML=`<div class="panel q-card"><div class="q-meta"><span class="dtag" style="--dc:var(--d${q.d})">D${q.d} · <bdi>${esc(tx(DOMS[q.d]))}</bdi></span><span class="q-id">${esc(q.id)}</span></div><p class="q-text">${esc(q.q)}</p><p class="q-hint">${hint(q)}</p><div id="qBody"></div><div id="qFb"></div><div class="qbar"><span></span><button class="btn" id="qBtn" type="button" disabled>${t("check")}</button></div></div>`;
 const btn=$("#qBtn");qState.onChange=()=>{btn.disabled=!ctl.answered()};
 const ctl=mountQ(q,$("#qBody"),qState);if(q.t==="o")btn.disabled=false;
 btn.onclick=()=>{if(qDone){nextQ();return}qState.touched=true;const ok=ctl.correct();ctl.reveal(true);qDone=true;
  const first=!S.ans[q.id];S.ans[q.id]={ok,t:Date.now()};
  if(ok){S.mist=S.mist.filter(x=>x!==q.id);addXP(first?10:5);toast(t("toast_xp",{n:first?10:5}));confetti(40)}else{if(!S.mist.includes(q.id))S.mist.push(q.id);addXP(2)}save();
  $("#qFb").innerHTML=`<div class="feedback ${ok?"ok":"no"}"><h4>${ok?t("right"):t("wrong")}</h4><p><b>${t("why")}:</b> ${esc(L==="ar"?q.ar:q.en)}</p>${L==="ar"?`<p class="muted" style="font-size:13px;direction:ltr;text-align:left">${esc(q.en)}</p>`:""}</div>`;
  btn.textContent=t("next");btn.disabled=false;renderQuizChrome()};
}
$("#quizFilter").addEventListener("click",e=>{const b=e.target.closest("[data-d]");if(b){qDom=+b.dataset.d;qCur=null;nextQ()}});
$("#quizMode").addEventListener("click",e=>{const b=e.target.closest("[data-m]");if(b){qMode=b.dataset.m;qCur=null;nextQ()}});

/* ---------- MOCK ---------- */
let M=null,mTimer=null;
function buildMock(){const qs=[];for(const d in MOCK_SPLIT){qs.push(...shuffle(QUESTIONS.filter(q=>q.d==d)).slice(0,MOCK_SPLIT[d]))}
 return{qs:shuffle(qs).map(q=>q.id),st:{},flags:[],i:0,end:Date.now()+90*60e3,done:false}}
function mockQ(id){return QUESTIONS.find(q=>q.id===id)}
function renderMock(){const box=$("#mockBox");clearInterval(mTimer);
 if(!M){const hist=S.mocks.slice(-6).reverse();
  box.innerHTML=`<div class="panel" style="display:grid;gap:14px"><p class="lead">${t("mock_intro")}</p><div class="row">${Object.keys(MOCK_SPLIT).map(d=>`<span class="dtag" style="--dc:var(--d${d})">D${d} · ${MOCK_SPLIT[d]}</span>`).join("")}</div><div><button class="btn spark" id="mStart" type="button">${t("mock_start")}</button></div></div>`+
  (hist.length?`<div class="panel"><h3 style="font-size:17px;margin-bottom:10px">${t("history")}</h3><div style="display:grid;gap:6px">${hist.map(h=>`<div class="row" style="justify-content:space-between"><span class="mono muted" style="font-size:12px">${esc(h.date)}</span><b class="mono ${h.score>=700?"pass":"fail"}">${h.score}</b></div>`).join("")}</div></div>`:"");
  $("#mStart").onclick=()=>{M=buildMock();renderMock()};return}
 if(M.done){renderResult();return}
 const id=M.qs[M.i],q=mockQ(id);M.st[id]=M.st[id]||{};
 box.innerHTML=`<div class="mock-top"><span class="timer" id="mTime">--:--</span><span class="mono muted" style="font-size:13px">${M.i+1} / ${M.qs.length}</span><button class="btn" id="mSubmit" type="button">${t("mock_submit")}</button></div>
 <div class="panel q-card"><div class="q-meta"><span class="dtag" style="--dc:var(--d${q.d})">D${q.d}</span><button class="chip" id="mFlag" type="button" aria-pressed="${M.flags.includes(id)}">⚑ ${M.flags.includes(id)?t("unflag"):t("flag")}</button></div><p class="q-text">${esc(q.q)}</p><p class="q-hint">${hint(q)}</p><div id="mBody"></div>
 <div class="qbar"><button class="btn ghost" id="mPrev" type="button" ${M.i?"":"disabled"}>${t("prev")}</button><button class="btn" id="mNext" type="button" ${M.i<M.qs.length-1?"":"disabled"}>${t("next")}</button></div></div>
 <div class="panel"><div class="grid-nav" id="mGrid"></div></div><div id="mConfirm"></div><div><button class="btn ghost" id="mQuit" type="button">${t("abandon")}</button></div>`;
 const st=M.st[id];st.onChange=()=>{st.touched=true;drawGrid()};const ctl=mountQ(q,$("#mBody"),st);st.ctl=ctl;
 function drawGrid(){$("#mGrid").innerHTML=M.qs.map((qid,k)=>{const s=M.st[qid];const a=s&&s.perm&&isAnswered(mockQ(qid),s);return`<button type="button" data-k="${k}" class="${a?"ans":""} ${M.flags.includes(qid)?"flag":""} ${k===M.i?"cur":""}">${k+1}</button>`}).join("")}
 drawGrid();
 $("#mGrid").onclick=e=>{const b=e.target.closest("[data-k]");if(b){M.i=+b.dataset.k;renderMock()}};
 $("#mPrev").onclick=()=>{M.i--;renderMock()};$("#mNext").onclick=()=>{M.i++;renderMock()};
 $("#mFlag").onclick=()=>{M.flags=M.flags.includes(id)?M.flags.filter(x=>x!==id):M.flags.concat(id);renderMock()};
 $("#mQuit").onclick=()=>{M=null;renderMock()};
 $("#mSubmit").onclick=()=>{const un=M.qs.filter(qid=>{const s=M.st[qid];return!(s&&s.perm&&isAnswered(mockQ(qid),s))}).length;
  if(!un){finishMock();return}
  $("#mConfirm").innerHTML=`<div class="feedback no"><p>${t("mock_confirm")} (${un})</p><div class="row"><button class="btn" id="mYes" type="button">${t("mock_yes")}</button><button class="btn ghost" id="mNo" type="button">${t("mock_no")}</button></div></div>`;
  $("#mYes").onclick=finishMock;$("#mNo").onclick=()=>{$("#mConfirm").innerHTML=""};$("#mConfirm").scrollIntoView({block:"center"})};
 const tk=()=>{const ms=Math.max(0,M.end-Date.now());const el=$("#mTime");if(!el)return;el.textContent=String(Math.floor(ms/6e4)).padStart(2,"0")+":"+String(Math.floor(ms/1e3)%60).padStart(2,"0");el.classList.toggle("low",ms<10*6e4);if(!ms)finishMock()};
 tk();mTimer=setInterval(tk,1000);
}
function isAnswered(q,s){return q.t==="s"||q.t==="m"?(s.sel||[]).length===q.a.length:q.t==="o"?!!s.touched:(s.match||[]).every(v=>v>=0)}
function finishMock(){clearInterval(mTimer);const by={};let ok=0;
 M.qs.forEach(id=>{const q=mockQ(id),s=M.st[id]||{};const good=s.perm?isCorrect(q,s):false;s.good=good;by[q.d]=by[q.d]||{ok:0,n:0};by[q.d].n++;if(good){by[q.d].ok++;ok++}
  if(!good&&!S.mist.includes(id))S.mist.push(id);if(s.perm)S.ans[id]={ok:good,t:Date.now()}});
 const score=Math.round(100+900*ok/M.qs.length);M.done=true;M.score=score;M.by=by;M.ok=ok;
 S.mocks.push({score,date:new Date().toLocaleString(L==="ar"?"ar-SA-u-ca-gregory":"en-US",{dateStyle:"medium",timeStyle:"short"}),by});addXP(50+ok);save();
 if(score>=700)confetti(140);renderMock()}
function renderResult(){const box=$("#mockBox"),pass=M.score>=700;
 box.innerHTML=`<div class="panel" style="display:grid;gap:12px;text-align:center;justify-items:center"><span class="eyebrow">${pass?t("passed"):t("failed")}</span><div class="result-big ${pass?"pass":"fail"}">${M.score}</div><span class="mono muted">${M.ok} / ${M.qs.length} · pass = 700</span></div>
 <div class="panel"><h3 style="font-size:17px;margin-bottom:12px">${t("per_dom")}</h3><div class="domains">${Object.keys(M.by).sort().map(d=>{const b=M.by[d],pc=Math.round(b.ok/b.n*100);return`<div class="dom" style="--dc:var(--d${d})"><span class="dtag" style="--dc:var(--d${d})">D${d}</span><span class="nm">${esc(tx(DOMS[d]))}</span><span class="pct">${b.ok}/${b.n}</span><div class="bar2"><i style="width:${pc}%"></i></div></div>`}).join("")}</div></div>
 <div class="panel"><h3 style="font-size:17px;margin-bottom:10px">${t("review")}</h3><div class="grid-nav" id="rGrid">${M.qs.map((id,k)=>`<button type="button" data-k="${k}" class="${M.st[id]&&M.st[id].good?"r-ok":"r-no"}">${k+1}</button>`).join("")}</div><div id="rBox" style="margin-top:14px"></div></div>
 <div class="row"><button class="btn spark" id="mAgain" type="button">${t("again")}</button><button class="btn ghost" type="button" data-go="quiz">${t("mode_mist")}</button></div>`;
 $("#mAgain").onclick=()=>{M=buildMock();renderMock()};
 $("#rGrid").onclick=e=>{const b=e.target.closest("[data-k]");if(!b)return;const id=M.qs[+b.dataset.k],q=mockQ(id),s=M.st[id]||{};const st={perm:s.perm,sel:(s.sel||[]).slice(),order:(s.order||[]).slice(),match:(s.match||[]).slice()};
  $("#rBox").innerHTML=`<div class="q-card"><p class="q-text">${esc(q.q)}</p><div id="rBody"></div><div class="feedback ${s.good?"ok":"no"}"><p>${esc(L==="ar"?q.ar:q.en)}</p></div></div>`;
  const ctl=mountQ(q,$("#rBody"),st);ctl.reveal(true)};
}

/* ---------- FLASHCARDS (Leitner) ---------- */
const FC=SERVICES.map(s=>({id:"s:"+s.n,f:s.n,k:"service",ar:s.ar,en:s.en})).concat(TERMS.map(x=>({id:"t:"+x[0],f:x[0],k:"concept",ar:x[1],en:x[2]})));
const GAP=[0,1,2,4,7,14];
let fcCur=null;
function fcDue(){const now=Date.now();return FC.filter(c=>{const s=S.fc[c.id];return!s||s.due<=now})}
function renderCards(){const due=fcDue();$("#fcDue").textContent=due.length+" "+t("fc_due");
 const counts=[1,2,3,4,5].map(b=>FC.filter(c=>(S.fc[c.id]?S.fc[c.id].box:1)===b).length);
 $("#fcBoxes").innerHTML=counts.map((n,i)=>`<div><b>${n}</b>${t("fc_box")} ${i+1}</div>`).join("");
 const fc=$("#fc");fc.classList.remove("flip");
 if(!due.length){fcCur=null;$("#fcKind").textContent="";$("#fcFront").textContent=t("fc_done");$("#fcBack").innerHTML="";$("#fcKnow").disabled=$("#fcAgain").disabled=true;return}
 $("#fcKnow").disabled=$("#fcAgain").disabled=false;
 due.sort((a,b)=>((S.fc[a.id]||{box:1}).box-(S.fc[b.id]||{box:1}).box)||Math.random()-.5);fcCur=due[0];
 $("#fcKind").textContent=fcCur.k;$("#fcFront").textContent=fcCur.f;
 $("#fcBack").innerHTML=`<b class="term" style="font-size:18px">${esc(fcCur.f)}</b><span>${esc(L==="ar"?fcCur.ar:fcCur.en)}</span>${L==="ar"?`<span class="en-line">${esc(fcCur.en)}</span>`:""}`;
}
function fcAnswer(know){if(!fcCur)return;const s=S.fc[fcCur.id]||{box:1};s.box=know?Math.min(5,s.box+1):1;s.due=know?Date.now()+GAP[s.box]*864e5-36e5:Date.now()+6e4;S.fc[fcCur.id]=s;addXP(know?2:1);save();renderCards()}
$("#fc").addEventListener("click",()=>$("#fc").classList.toggle("flip"));
$("#fc").addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();$("#fc").classList.toggle("flip")}});
$("#fcKnow").addEventListener("click",()=>fcAnswer(true));$("#fcAgain").addEventListener("click",()=>fcAnswer(false));

/* ---------- KEYWORDS ---------- */
function renderKeys(){const q=$("#kwSearch").value.trim().toLowerCase();
 $("#kwList").innerHTML=KEYWORDS.filter(k=>!q||k.join(" ").toLowerCase().includes(q)).map(k=>`<div class="kwr"><span class="ph">"${esc(k[0])}"</span><span class="arr">${L==="ar"?"←":"→"}</span><span class="ans"><b>${esc(k[1])}</b><small>${esc(L==="ar"?k[2]:"")}</small></span></div>`).join("")||`<div class="empty">—</div>`}
$("#kwSearch").addEventListener("input",renderKeys);

/* ---------- VIDEOS ---------- */
function renderVideos(){$("#vidList").innerHTML=VIDEOS.map(g=>`<div class="set"><div class="set-head"><h3>${esc(tx(g.g))}</h3></div><div class="vids">${g.items.map(v=>`<a class="vid" href="${esc(v.u)}" target="_blank" rel="noopener"><span class="play ${v.yt?"":"doc"}">${v.yt?"▶":"↗"}</span><h4>${esc(L==="ar"?v.ar:v.en)}</h4><p>${esc(L==="ar"?v.dar:v.den)}</p><span class="url">${esc(v.u.replace(/^https:\/\/(www\.)?/,"").slice(0,60))}</span></a>`).join("")}</div></div>`).join("")}

/* ---------- boot ---------- */
function renderAll(){renderHome();renderServices();renderCompare();if(!qCur||qDone)nextQ();else renderQuiz();renderMock();renderCards();renderKeys();renderVideos()}
applyTheme();applyLang();touch();save();renderAll();show(location.hash.slice(1));
})();
</script>
