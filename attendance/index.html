<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141519">
<title>تسجيل الحضور · أكاديمية الطاقة والمياه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@600;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="style.css">
<style>
main { max-width: 440px; margin: 0 auto; padding: 32px 16px 48px; }
header { margin-bottom: 24px; }
header h1 { font-size: 28px; margin: 12px 0 4px; }
.card { background: var(--ink2); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; }
label { display: block; font-weight: 600; margin-bottom: 6px; }
input {
  width: 100%; height: 52px; padding: 0 16px; margin-bottom: 18px;
  border-radius: 12px; border: 1px solid var(--line); background: var(--ink);
  color: var(--on); font: 500 17px var(--body);
}
input:focus { outline: 2px solid var(--y); outline-offset: 1px; border-color: transparent; }
input.ltr { direction: ltr; text-align: right; font-family: var(--mono); }
button {
  width: 100%; height: 56px; border: 0; border-radius: 14px; cursor: pointer;
  background: var(--y); color: #141519; font: 800 18px var(--display);
}
button:disabled { opacity: .45; cursor: not-allowed; }
.hint { font-size: 14px; color: var(--mute); margin-top: 12px; text-align: center; }
.error { color: #ff8a8e; background: rgba(229, 72, 77, .12); border-radius: 12px; padding: 12px 14px; margin-top: 14px; }
.done { text-align: center; }
.done .big { font-size: 56px; line-height: 1; margin-bottom: 8px; }
.done h2 { font-size: 24px; margin-bottom: 6px; }
.done .time { font-size: 40px; color: var(--y); margin: 14px 0 4px; }
.link { display: block; text-align: center; margin-top: 18px; color: var(--mute); font-size: 14px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <span id="state" class="pill"><span class="dot"></span><span>جاري التحميل…</span></span>
    <h1>تسجيل الحضور</h1>
    <div class="muted">أكاديمية الطاقة والمياه · لازم تكون داخل الأكاديمية</div>
  </header>

  <div id="setup" class="notice" hidden>
    الموقع يحتاج ربط بقاعدة البيانات. عبّي <code>attendance/config.js</code> (الخطوات في <code>attendance/README.md</code>).
  </div>

  <form id="form" class="card" hidden>
    <label for="name">الاسم الكامل</label>
    <input id="name" autocomplete="name" required minlength="2" maxlength="80" placeholder="مثال: أفنان الجهني">
    <label for="aid">الرقم الأكاديمي</label>
    <input id="aid" class="ltr" inputmode="numeric" autocomplete="off" required minlength="3" maxlength="20" placeholder="000000">
    <button id="submit" type="submit">سجّل حضوري</button>
    <div id="error" class="error" hidden></div>
    <div class="hint">بنطلب موقعك مرة وحدة عشان نتأكد إنك داخل الأكاديمية. ما نحفظ موقعك، بس المسافة.</div>
  </form>

  <div id="done" class="card done" hidden>
    <div class="big" id="doneIcon">✅</div>
    <h2 id="doneTitle">تم تسجيل حضورك</h2>
    <div class="muted" id="doneName"></div>
    <div class="time mono" id="doneTime"></div>
    <span class="pill" id="doneStatus"></span>
  </div>

  <a class="link" href="wall.html">شاشة الحضور ←</a>
</main>

<script src="config.js"></script>
<script src="api.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let schedule = null;

// معرّف ثابت للجهاز عشان الجوال الواحد ما يحضّر لأكثر من شخص
function deviceId() {
  try {
    let id = localStorage.getItem("att-device");
    if (!id) { id = crypto.randomUUID(); localStorage.setItem("att-device", id); }
    return id;
  } catch { return null; }
}

function renderState() {
  if (!schedule) return;
  const st = Att.lectureState(schedule.lectures, schedule.settings);
  const el = $("state");
  el.className = "pill " + (st.kind === "open" ? "open" : st.kind === "wait" ? "wait" : "");
  el.lastElementChild.textContent =
    st.kind === "open" ? `${st.lecture.title} · التحضير مفتوح (يقفل بعد ${st.closesIn} د)` :
    st.kind === "wait" ? `${st.lecture.title} · يفتح بعد ${st.opensIn >= 60 ? Math.floor(st.opensIn / 60) + " س " : ""}${st.opensIn % 60} د` :
    "خلصت محاضرات اليوم";
}

function getPosition() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error("جهازك ما يدعم تحديد الموقع"));
    navigator.geolocation.getCurrentPosition(resolve, (e) => reject(new Error(
      e.code === 1 ? "لازم تسمح للموقع يوصل لمكانك. من إعدادات المتصفح فعّل الموقع وحاول مرة ثانية" :
      "ما قدرنا نحدد موقعك. شغّل GPS وحاول مرة ثانية"
    )), { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  });
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("submit");
  $("error").hidden = true;
  btn.disabled = true;
  try {
    btn.textContent = "نحدد موقعك…";
    const pos = await getPosition();
    btn.textContent = "نسجّل…";
    const r = await Att.call("rpc/check_in", { method: "POST", body: {
      p_name: $("name").value, p_academic_id: $("aid").value,
      p_lat: pos.coords.latitude, p_lng: pos.coords.longitude, p_accuracy: pos.coords.accuracy,
      p_device: deviceId(),
    }});
    try { localStorage.setItem("att-me", JSON.stringify({ name: $("name").value, aid: $("aid").value })); } catch {}
    $("form").hidden = true;
    $("done").hidden = false;
    $("doneIcon").textContent = r.already ? "👌" : "✅";
    $("doneTitle").textContent = r.already ? "حضورك مسجل من قبل" : "تم تسجيل حضورك";
    $("doneName").textContent = `${r.full_name} · ${r.title}`;
    $("doneTime").textContent = Att.fmtTime(r.checked_in_at);
    $("doneStatus").className = "pill " + (r.status === "late" ? "late" : "open");
    $("doneStatus").textContent = r.minutes === 0 ? "في الوقت" :
      r.status === "late" ? `متأخر ${r.minutes} د` : `بعد البداية بـ ${r.minutes} د`;
  } catch (err) {
    $("error").textContent = err.message;
    $("error").hidden = false;
  } finally {
    btn.disabled = false;
    btn.textContent = "سجّل حضوري";
  }
});

(async () => {
  if (!Att.ready) { $("setup").hidden = false; $("state").hidden = true; return; }
  try {
    const me = JSON.parse(localStorage.getItem("att-me") || "null");
    if (me) { $("name").value = me.name; $("aid").value = me.aid; }
  } catch {}
  $("form").hidden = false;
  try {
    schedule = await Att.loadSchedule();
    renderState();
    setInterval(renderState, 15000);
  } catch (err) {
    $("state").lastElementChild.textContent = err.message;
  }
})();
</script>
</body>
</html>
