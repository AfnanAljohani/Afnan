<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#030806">
<title>شاشة الحضور · أكاديمية الطاقة والمياه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@600;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="style.css?v=4">
<style>
main { padding: 28px clamp(16px, 3vw, 48px) 48px; }
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
.top h1 { font-size: clamp(28px, 4vw, 52px); font-weight: 900; margin-top: 10px; }
.clock { font-size: clamp(36px, 5vw, 72px); color: var(--y); line-height: 1; }
.stats { display: flex; gap: 12px; flex-wrap: wrap; }
.stat { background: var(--ink2); border: 1px solid var(--line); border-radius: 14px; padding: 10px 18px; min-width: 120px; }
.stat b { display: block; font: 800 32px var(--display); }
.stat.g b { color: #5fd39c; } .stat.o b { color: var(--orange); }
.tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 22px; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--ink2); color: var(--mute);
  border-radius: 12px; padding: 8px 16px; cursor: pointer; font: 600 15px var(--body); text-align: right;
}
.tab small { display: block; text-align: right; font-family: var(--mono); font-size: 12px; }
.tab.on { background: var(--y); color: #141519; border-color: var(--y); }
.tab .n { font-family: var(--mono); margin-inline-start: 6px; opacity: .8; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.p {
  position: relative; background: var(--ink2); border: 1px solid var(--line); border-radius: var(--r);
  padding: 18px 18px 16px; overflow: hidden;
}
.p.new { animation: arrive 1.2s cubic-bezier(.2, .9, .3, 1.2); border-color: var(--y); box-shadow: 0 0 0 4px var(--y-soft); }
@keyframes arrive { from { transform: translateY(18px) scale(.94); opacity: 0; } }
.p .rank { position: absolute; top: 14px; left: 16px; font: 600 13px var(--mono); color: var(--mute); }
.p .nm { font: 700 20px var(--display); margin: 0 0 12px; padding-left: 36px; word-break: break-word; }
.p .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.p .t { font: 600 26px var(--mono); }
.empty { grid-column: 1 / -1; text-align: center; padding: 60px 16px; color: var(--mute); font-size: 20px; }
.toast {
  position: fixed; bottom: 24px; inset-inline: 0; margin: auto; width: fit-content; max-width: calc(100% - 32px);
  background: var(--y); color: #141519; font: 800 22px var(--display); padding: 14px 26px; border-radius: 16px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, .5); transition: transform .4s, opacity .4s;
}
.toast[hidden] { display: block; opacity: 0; transform: translateY(30px); pointer-events: none; }
</style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <span id="state" class="pill"><span class="dot"></span><span>جاري التحميل…</span></span>
      <h1>الحاضرين اليوم</h1>
      <div class="muted" id="date"></div>
    </div>
    <div class="stats">
      <div class="stat g"><b class="mono" id="sOn">0</b><span class="muted">في الوقت</span></div>
      <div class="stat o"><b class="mono" id="sLate">0</b><span class="muted">متأخرين</span></div>
      <div class="stat"><b class="mono clock" id="clock">--:--</b><span class="muted">توقيت الرياض</span></div>
    </div>
  </div>

  <div id="setup" class="notice" hidden>
    الشاشة تحتاج ربط بقاعدة البيانات. الصقي رابط Google Apps Script في <code>attendance/config.js</code> (الخطوات في <code>attendance/README.md</code>).
  </div>

  <nav class="tabs" id="tabs"></nav>
  <section class="grid" id="grid"></section>
</main>
<footer class="credit">Made with Love by AFNAN aljohani</footer>
<div class="toast" id="toast" hidden></div>

<script src="config.js?v=4"></script>
<script src="api.js?v=4"></script>
<script>
const $ = (id) => document.getElementById(id);
let schedule = null, rows = [], selected = null, pinned = false, seen = null, toastTimer;

function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

function tick() {
  $("clock").textContent = new Date().toLocaleTimeString("en-GB", { timeZone: "Asia/Riyadh", hour: "2-digit", minute: "2-digit" });
  $("date").textContent = new Date().toLocaleDateString("ar-SA-u-nu-latn", { timeZone: "Asia/Riyadh", weekday: "long", day: "numeric", month: "long" });
  if (!schedule) return;
  const st = Att.lectureState(schedule.lectures, schedule.settings);
  $("state").className = "pill " + (st.kind === "open" ? "open" : st.kind === "wait" ? "wait" : "");
  $("state").lastElementChild.textContent =
    st.kind === "open" ? `${st.lecture.title} · التحضير مفتوح` :
    st.kind === "wait" ? `${st.lecture.title} · يفتح بعد ${st.opensIn} د` : "خلصت محاضرات اليوم";
  // تنتقل الشاشة تلقائيًا للمحاضرة الحالية إلا إذا أحد اختار محاضرة بيده
  if (!pinned && st.kind !== "done") selected = st.lecture.num;
  if (selected == null) selected = schedule.lectures[schedule.lectures.length - 1].num;
}

function render() {
  if (!schedule) return;
  $("tabs").innerHTML = schedule.lectures.map((l) => {
    const n = rows.filter((r) => r.lecture === l.num).length;
    return `<button class="tab ${l.num === selected ? "on" : ""}" data-n="${l.num}">${esc(l.title)}<span class="n">${n}</span><small dir="ltr">${l.starts_at}–${l.ends_at}</small></button>`;
  }).join("");
  const list = rows.filter((r) => r.lecture === selected).sort((a, b) => a.checked_in_at.localeCompare(b.checked_in_at));
  $("sOn").textContent = list.filter((r) => r.status === "on_time").length;
  $("sLate").textContent = list.filter((r) => r.status === "late").length;
  $("grid").innerHTML = list.length ? list.map((r, i) => `
    <article class="p ${seen && !seen.has(key(r)) ? "new" : ""}">
      <span class="rank">#${i + 1}</span>
      <h3 class="nm">${esc(r.full_name)}</h3>
      <div class="row">
        <span class="t">${Att.fmtTime(r.checked_in_at)}</span>
        <span class="pill ${r.status === "late" ? "late" : "open"}">${r.minutes_from_start === 0 ? "في الوقت" : (r.status === "late" ? "متأخر " : "+") + r.minutes_from_start + " د"}</span>
      </div>
    </article>`).join("") : `<div class="empty">ما أحد سجّل حضوره في هالمحاضرة للحين</div>`;
}

const key = (r) => r.full_name + "|" + r.lecture + "|" + r.checked_in_at;

async function refresh() {
  try {
    rows = await Att.today();
    if (seen) {
      const fresh = rows.filter((r) => !seen.has(key(r)));
      if (fresh.length) {
        $("toast").textContent = `👋 أهلًا ${fresh[0].full_name}` + (fresh.length > 1 ? ` و${fresh.length - 1} غيره` : "");
        $("toast").hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => ($("toast").hidden = true), 3500);
      }
    }
    render();
    seen = new Set(rows.map(key));
  } catch (err) {
    $("state").lastElementChild.textContent = err.message;
  }
}

$("tabs").addEventListener("click", (e) => {
  const b = e.target.closest(".tab");
  if (!b) return;
  selected = +b.dataset.n;
  pinned = true;
  render();
});

(async () => {
  tick(); setInterval(tick, 1000);
  if (!Att.ready) { $("setup").hidden = false; return; }
  schedule = await Att.loadSchedule();
  tick();
  await refresh();
  setInterval(refresh, 4000);
})();
</script>
</body>
</html>
