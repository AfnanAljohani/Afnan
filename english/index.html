<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مسار الإنجليزية · English Path</title>
<meta name="description" content="منصة عائلية لتعلم اللغة الإنجليزية بالمهارات الأربع من الصفر حتى الاحتراف، مع خطة يومية لمدة 3 أشهر (13 أكتوبر – 13 يناير).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: sticky formal masthead + tab nav; one centred column of views (home, levels, skills, apps, learners, AI terms) switched by #hash. */
:root{
  --bg:#F4F5F1; --surface:#FFFFFF; --surface-2:#EEF1EC; --ink:#17241F; --muted:#5A6862; --line:#D9DFD9;
  --accent:#1D5642; --accent-ink:#FFFFFF; --accent-soft:#E2EDE7; --brass:#9C7426; --brass-soft:#F3EBDA;
  --read:#2C5E8C; --listen:#2A7B78; --speak:#B0612A; --write:#9A3F5C; --other:#5F6B3A;
  --done:#2F7D4F; --shadow:0 1px 2px rgba(23,36,31,.06),0 6px 20px rgba(23,36,31,.05);
  --f-display:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101714; --surface:#17211D; --surface-2:#1D2924; --ink:#E7ECE8; --muted:#9AA8A1; --line:#2B3833;
  --accent:#6FC3A0; --accent-ink:#0D1512; --accent-soft:#1F3A30; --brass:#D9B26A; --brass-soft:#3A311F;
  --read:#7FB0E0; --listen:#6CC9C3; --speak:#E9A06A; --write:#E58FAD; --other:#B9C67E;
  --done:#6FC88F; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#101714; --surface:#17211D; --surface-2:#1D2924; --ink:#E7ECE8; --muted:#9AA8A1; --line:#2B3833;
  --accent:#6FC3A0; --accent-ink:#0D1512; --accent-soft:#1F3A30; --brass:#D9B26A; --brass-soft:#3A311F;
  --read:#7FB0E0; --listen:#6CC9C3; --speak:#E9A06A; --write:#E58FAD; --other:#B9C67E;
  --done:#6FC88F; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.75 var(--f-body)}
a{color:var(--accent)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.35;text-wrap:balance;margin:0}
.en{direction:ltr;unicode-bidi:isolate;font-family:var(--f-body)}
.muted{color:var(--muted)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:6px}

/* masthead */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding-inline:16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.seal{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 15px/1 var(--f-mono);letter-spacing:.02em;flex:none}
.brand b{font-family:var(--f-display);font-size:18px;display:block;line-height:1.2}
.brand small{font-size:12px;color:var(--muted);letter-spacing:.06em;display:block}
nav.tabs{display:flex;gap:4px;overflow-x:auto;margin-inline-start:auto;scrollbar-width:none;max-width:100%}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{white-space:nowrap;text-decoration:none;color:var(--muted);padding:7px 12px;border-radius:8px;font-weight:500;font-size:15px}
nav.tabs a:hover{background:var(--surface-2);color:var(--ink)}
nav.tabs a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}

main{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:28px 64px}
.view{display:grid;gap:28px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--brass);font-weight:600;text-transform:uppercase}
.sec-head{display:grid;gap:6px;max-width:70ch}
.sec-head h2{font-size:clamp(22px,3.2vw,30px)}
.sec-head p{margin:0;color:var(--muted)}
.bi{display:grid;gap:2px}
.bi .en{color:var(--muted);font-size:.9em}

/* hero */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:stretch}
.hero-copy{display:grid;gap:14px;align-content:center}
.hero h1{font-size:clamp(28px,4.6vw,46px);font-weight:800}
.hero h1 .en{display:block;font-size:.5em;color:var(--brass);font-family:var(--f-display);font-weight:700;margin-top:4px}
.hero p{margin:0;max-width:60ch;color:var(--muted)}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:hover{filter:brightness(1.05)}
.ledger{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:14px;box-shadow:var(--shadow)}
.ledger .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px dashed var(--line);padding-bottom:10px}
.ledger .row:last-child{border-bottom:0;padding-bottom:0}
.ledger .num{font:500 22px/1 var(--f-mono);color:var(--accent);font-variant-numeric:tabular-nums}
.meter{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--brass);border-radius:99px}

/* generic grids & cards */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:10px;align-content:start;min-width:0}
.card h3{font-size:18px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:6px}

/* skill colours */
.k-read{--k:var(--read)} .k-listen{--k:var(--listen)} .k-speak{--k:var(--speak)} .k-write{--k:var(--write)}
.k-vocab,.k-app,.k-test,.k-ai,.k-review{--k:var(--other)}
.k-ai{--k:var(--brass)}
.chip-k{color:var(--k);background:color-mix(in srgb,var(--k) 12%,transparent);font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}

/* four skills strip */
.skills4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.skill-tile{border-top:3px solid var(--k);background:var(--surface);border-radius:10px;padding:16px;display:grid;gap:4px;text-decoration:none;color:var(--ink);border-inline:1px solid var(--line);border-bottom:1px solid var(--line)}
.skill-tile b{font-family:var(--f-display);font-size:18px}
.skill-tile span{font-size:14px;color:var(--muted)}

/* member cards */
.members{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.mcard{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;transition:border-color .15s}
.mcard:hover{border-color:var(--accent)}
.avatar{grid-row:span 2;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font:800 22px/1 var(--f-display);position:relative}
.avatar sub{position:absolute;bottom:-4px;inset-inline-start:-4px;background:var(--brass);color:var(--surface);font:500 11px/1 var(--f-mono);padding:3px 5px;border-radius:6px}
.mcard b{font-family:var(--f-display);font-size:19px}
.mcard .meta{font-size:13px;color:var(--muted)}
.mcard .meter{grid-column:1/-1;margin-top:8px}
.mcard .today{grid-column:1/-1;font-size:13px;color:var(--muted);display:flex;justify-content:space-between}

/* levels ladder */
.ladder{display:grid;gap:10px}
.rung{display:grid;grid-template-columns:84px 1fr auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
.rung .code{font:500 26px/1 var(--f-mono);color:var(--accent);text-align:center}
.rung .code small{display:block;font:600 11px/1.4 var(--f-body);color:var(--muted);margin-top:4px}
.rung h3{font-size:17px}
.rung p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.rung .when{font-size:12px;font-weight:600;color:var(--brass);background:var(--brass-soft);padding:4px 10px;border-radius:99px;white-space:nowrap}
.phase-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.phase{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:6px}
.phase .dates{font:500 13px/1 var(--f-mono);color:var(--brass)}

/* segmented control */
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:99px;cursor:pointer;font-weight:500;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* skill detail */
.stages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.stage h4{font-size:15px;display:flex;justify-content:space-between;gap:8px}
.stage ol{margin:0;padding-inline-start:20px;display:grid;gap:6px;font-size:15px}
.stage li .en{display:block;font-size:13px;color:var(--muted)}
ul.clean{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ul.clean li{display:grid;gap:0;padding-inline-start:14px;border-inline-start:2px solid var(--line)}
ul.clean li .en{font-size:13px;color:var(--muted)}

/* apps */
.app{grid-template-rows:auto auto 1fr auto}
.app-top{display:flex;justify-content:space-between;align-items:start;gap:10px}
.app h3 .en{display:block;font-size:13px;color:var(--muted);font-family:var(--f-body);font-weight:500}
.price{font-size:12px;font-weight:600;color:var(--brass);background:var(--brass-soft);padding:2px 9px;border-radius:99px;white-space:nowrap}
.app p{margin:0;font-size:14.5px}
.app a.go{font-weight:600;font-size:14px;text-decoration:none}

/* plan */
.profile{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.profile .avatar{width:64px;height:64px;font-size:28px;grid-row:auto}
.profile h2{font-size:26px}
.profile .facts{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted);margin-top:4px}
.ring{width:96px;height:96px;position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring b{font:500 20px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.ring small{display:block;font-size:11px;color:var(--muted);text-align:center;margin-top:2px}
.weeks{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.weeks button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;cursor:pointer;text-align:center;line-height:1.3}
.weeks button b{display:block;font-size:14px}
.weeks button small{font:500 11px/1 var(--f-mono);color:var(--muted)}
.weeks button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.weeks button[aria-pressed="true"] small{color:inherit;opacity:.85}
.weeks button.has-today:not([aria-pressed="true"]){border-color:var(--brass)}
.week-info{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.week-info .card{gap:4px}
.days{display:grid;gap:14px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.day.is-today{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass)}
.day.is-past .day-head{opacity:.92}
.day-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.day-head .d{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.day-head b{font-family:var(--f-display);font-size:16px}
.day-head .num{font:500 13px/1 var(--f-mono);color:var(--muted)}
.day-head .badge{font-size:12px;font-weight:700;background:var(--brass);color:var(--surface);padding:2px 10px;border-radius:99px}
.day-head .count{font:500 13px/1 var(--f-mono);color:var(--muted)}
.day-head .count.full{color:var(--done)}
.words{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px 0}
.word{font-size:13px;border:1px solid var(--line);border-radius:8px;padding:3px 9px;display:inline-flex;gap:6px}
.word .en{font-weight:600}
.tasks{list-style:none;margin:0;padding:8px 8px 12px;display:grid;gap:2px}
.task label{display:grid;grid-template-columns:auto auto 1fr;gap:10px;align-items:start;padding:8px;border-radius:8px;cursor:pointer}
.task label:hover{background:var(--surface-2)}
.task input{width:18px;height:18px;margin:4px 0 0;accent-color:var(--done);cursor:pointer}
.task .chip-k{margin-top:2px}
.task .txt{display:grid;min-width:0}
.task .txt .en{font-size:13.5px;color:var(--muted)}
.task input:checked ~ .txt{text-decoration:line-through;text-decoration-color:var(--muted);opacity:.7}
.term-inline{display:inline-block;margin-top:4px;font-size:13px;background:var(--brass-soft);color:var(--ink);padding:2px 8px;border-radius:6px}

/* AI glossary */
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.search{flex:1 1 240px;max-width:360px;padding:9px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
.terms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.term{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:6px;min-width:0}
.term-top{display:flex;justify-content:space-between;align-items:start;gap:10px}
.term h3{font-size:17px;direction:ltr;text-align:left;font-family:var(--f-body);font-weight:700}
.term .ar{font-family:var(--f-display);font-weight:700;color:var(--accent)}
.term p{margin:0;font-size:14.5px}
.term .ex{font-size:13.5px;color:var(--muted);font-style:italic;border-inline-start:2px solid var(--brass);padding-inline-start:10px}
.lvl-1{--k:var(--listen)} .lvl-2{--k:var(--read)} .lvl-3{--k:var(--speak)} .lvl-4{--k:var(--write)}
.note{background:var(--brass-soft);border-radius:12px;padding:14px 18px;font-size:14.5px}
footer{border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:13px;padding-block:20px;padding-inline:16px}

@media (max-width:900px){
  .hero,.g3,.members,.stages,.week-info,.phase-strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero{grid-template-columns:1fr}
  .skills4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:600px){
  .g2,.g3,.members,.stages,.week-info,.phase-strip,.terms{grid-template-columns:1fr}
  .profile{grid-template-columns:auto 1fr}
  .profile .ring{grid-column:1/-1;justify-self:start}
  .rung{grid-template-columns:60px 1fr}
  .rung .when{grid-column:2;justify-self:start}
  nav.tabs{margin-inline-start:0;width:100%}
  .task label{grid-template-columns:auto 1fr}
  .task .chip-k{justify-self:start}
  .task .txt{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#home"><span class="seal">EN</span><span><b>مسار الإنجليزية</b><small class="en">ENGLISH PATH · A1 → C2</small></span></a>
    <nav class="tabs" id="tabs" aria-label="الأقسام الرئيسية">

  </div>
</header>
<main id="view" class="view" aria-live="polite"></main>
<footer>مسار الإنجليزية · English Path — خطة 13 أكتوبر 2026 حتى 13 يناير 2027 · يُحفظ تقدّمك في هذا المتصفح فقط</footer>

const WEEKS = [

/* ===================== PLAN GENERATOR ===================== */
function buildDay(member, d){
  const g = GROUPS[member.group];
  const date = dayDate(d);
  const dow = date.getDay();                 // 5 = Friday, 6 = Saturday
  const week = Math.min(Math.floor(d/7), WEEKS.length-1);
  const W = WEEKS[week];
  const phase = d < 31 ? 0 : d < 61 ? 1 : 2;  // month 1, 2, 3
  const kid = member.group === "kid";
  const words = Array.from({length: phase === 0 ? 2 : 3}, (_, j) => W.w[(d + j) % 7]);
  const ctx = {theme:W.ar, themeEn:W.en, g:W.g, gEn:W.gEn, m:g.m, rr:g.rr[phase], rl:g.rl[phase], cam:g.cam,
               words:words.map(w=>w[0]).join("، "), wordsEn:words.map(w=>w[0]).join(", ")};
  const pick = (skill, off) => {
    const t = T[skill][phase][(d + off) % 4];
    const useKid = kid && t[2];
    return {k:skill, ar:fill(useKid ? t[2] : t[0], ctx), en:fill(useKid ? t[3] : t[1], ctx)};
  };
  const tasks = [];

  if (d === 0) tasks.push({k:"test", ar:"اختبار تحديد المستوى على EF SET (أو اختبار British Council) وسجّل نتيجتك.", en:"Take the EF SET (or British Council) placement test and write down your score."});
  if (d === 31 || d === 61) tasks.push({k:"test", ar:`نقطة تقييم الشهر ${d===31?"الأول":"الثاني"}: أعد الاختبار القصير وقارن نتيجتك بالبداية.`, en:`Month ${d===31?"1":"2"} checkpoint: retake a short level test and compare with your first score.`});
  if (d === TOTAL-1) tasks.push({k:"test", ar:"الاختبار النهائي على EF SET 🎓 قارن نتيجتك باليوم الأول واحتفل بإنجازك!", en:"Final EF SET test 🎓 compare with day one and celebrate!"});

  if (dow === 5) {                // Friday — light review
    tasks.push({k:"review", ar:`راجع كل كلمات أسبوع «${W.ar}» في Anki أو Quizlet.`, en:`Review all the “${W.en}” words in Anki or Quizlet.`});
    tasks.push({k:"listen", ar: kid ? "شاهد حلقة كرتون كاملة بالإنجليزية للمتعة." : "شاهد حلقة أو فيلمًا بالإنجليزية للمتعة مع ترجمة إنجليزية.", en: kid ? "Watch a full cartoon episode in English, just for fun." : "Watch an episode or film in English for fun, with English subtitles."});
    tasks.push({k:"write", ar:"اكتب ملخّص الأسبوع: 5 أشياء تعلّمتها هذا الأسبوع.", en:"Write a weekly recap: 5 things you learned this week."});
  } else if (dow === 6) {         // Saturday — conversation + quiz
    tasks.push({k:"speak", ar:`حصة محادثة على ${g.cam} (${kid?15:25} دقيقة) عن موضوع الأسبوع «${W.ar}».`, en:`Conversation lesson on ${g.cam} (${kid?15:25} min) about this week's topic, “${W.en}”.`});
    tasks.push({k:"test", ar:`اختبار ذاتي أسبوعي: كلمات الأسبوع + قاعدة ${W.g}.`, en:`Weekly self-quiz: this week's words + ${W.gEn}.`});
    tasks.push({k:"listen", ar:"Shadowing لمقطع تحبه لمدة 10 دقائق.", en:"Shadow a clip you like for 10 minutes."});
    tasks.push({k:"read", ar:`اقرأ عن موضوع الأسبوع القادم: «${WEEKS[Math.min(week+1,WEEKS.length-1)].ar}».`, en:`Preview next week's topic: “${WEEKS[Math.min(week+1,WEEKS.length-1)].en}”.`});
  } else {
    tasks.push({k:"vocab", ar:"احفظ كلمات اليوم (المكتوبة أعلاه) وأضفها إلى تطبيق Anki مع معانيها.", en:`Learn today's words and add them to Anki: ${ctx.wordsEn}.`});
    tasks.push(pick("read",0), pick("listen",1), pick("speak",2), pick("write",3));
  }
  tasks.push(kid
    ? {k:"app", ar:"Duolingo (أو Duolingo ABC): درس إلى درسين وحافظ على السلسلة 🔥", en:"Duolingo (or Duolingo ABC): 1–2 lessons, keep your streak 🔥"}
    : {k:"app", ar:"Duolingo: أكمل 2–3 دروس وحافظ على السلسلة 🔥", en:"Duolingo: finish 2–3 lessons and keep your streak 🔥"});

  if (member.ai) {
    const term = AI_TERMS[d % AI_TERMS.length];
    const rev = d >= AI_TERMS.length;
    tasks.push({k:"ai", ar:`${rev?"مراجعة":"مصطلح اليوم"} في الذكاء الاصطناعي: احفظه واكتب به جملة بالإنجليزية.`, en:`${rev?"Review":"AI term of the day"}: learn it and use it in an English sentence.`, term});
  }
  return {d, date, dow, week, W, phase, words, tasks};
}

function memberStats(m){
  let total = 0, done = 0;
  for (let d=0; d<TOTAL; d++){
    const n = buildDay(m,d).tasks.length; total += n;
    for (let i=0;i<n;i++) if (DONE[`${m.id}|${d}|${i}`]) done++;
  }
  return {total, done, pct: total ? Math.round(done/total*100) : 0};
}

/* ===================== VIEWS ===================== */
const bi = (ar,en,tag="div") => `<${tag} class="bi"><span>${ar}</span><span class="en">${en}</span></${tag}>`;
const head = (eb,ar,en,p) => `<header class="sec-head"><span class="eyebrow">${eb}</span><h2>${ar}</h2><span class="en muted">${en}</span>${p?`<p>${p}</p>`:""}</header>`;
const chip = k => `<span class="chip-k k-${k}">${SKILL_LABEL[k]}</span>`;

function dayStatus(){
  const t = todayIndex();
  if (t < 0) return {ar:`تبدأ الخطة بعد ${-t} يوم`, en:`Starts in ${-t} days`, idx:0, pct:0};
  if (t >= TOTAL) return {ar:"اكتملت الخطة 🎓", en:"Plan complete", idx:TOTAL-1, pct:100};
  return {ar:`اليوم ${t+1} من ${TOTAL}`, en:`Day ${t+1} of ${TOTAL}`, idx:t, pct:Math.round((t+1)/TOTAL*100)};
}

function memberCards(){
  const st = dayStatus();
  return `<div class="members">${MEMBERS.map(m=>{
    const s = memberStats(m), day = buildDay(m, st.idx);
    const td = day.tasks.filter((_,i)=>DONE[`${m.id}|${st.idx}|${i}`]).length;
    return `<a class="mcard" href="#${m.id}">
      <span class="avatar">${m.ar[0]}<sub>${m.age}</sub></span>
      <b>${m.ar} <span class="en muted" style="font-size:14px;font-weight:500">${m.en}</span></b>
      <span class="meta">${GROUPS[m.group].label} · ${m.focus}</span>

      <span class="today"><span>مهمات اليوم: <b class="en">${td}/${day.tasks.length}</b></span><span class="en">${s.pct}% overall</span></span>
    </a>`;}).join("")}</div>`;
}

function ring(p){
  const r=42, c=2*Math.PI*r;
  return `<svg viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="8"/><circle cx="48" cy="48" r="${r}" fill="none" stroke="var(--brass)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c*p/100} ${c}"/></svg>`;
}

function viewMember(m){
  const st = dayStatus(), s = memberStats(m), g = GROUPS[m.group];
  const nWeeks = Math.ceil(TOTAL/7);
  const todayWeek = Math.floor(st.idx/7);
  const key = "w-"+m.id;
  const wk = viewState[key] ?? todayWeek;
  const from = wk*7, to = Math.min(TOTAL, from+7);
  const W = WEEKS[Math.min(wk, WEEKS.length-1)];
  const t = todayIndex();
  let days = "";
  for (let d=from; d<to; d++){
    const day = buildDay(m,d);
    const doneN = day.tasks.filter((_,i)=>DONE[`${m.id}|${d}|${i}`]).length;
    const kind = day.dow===5 ? "مراجعة · Review" : day.dow===6 ? "محادثة واختبار · Talk & quiz" : "";
    days += `<article class="day ${d===t?"is-today":""} ${d<t?"is-past":""}" id="day-${d}">
      <div class="day-head">
        <div class="d"><b>${fmtAr(day.date,{weekday:"long",day:"numeric",month:"long"})}</b><span class="num">${fmtEn(day.date,{weekday:"short",day:"2-digit",month:"short",year:"numeric"})} · Day ${d+1}</span>${d===t?`<span class="badge">اليوم</span>`:""}${kind?`<span class="tag">${kind}</span>`:""}</div>
        <span class="count ${doneN===day.tasks.length?"full":""}">${doneN}/${day.tasks.length} ✓</span>
      </div>
      ${day.dow<5 ? `<div class="words">${day.words.map(w=>`<span class="word"><span class="en">${w[0]}</span><span class="muted">${w[1]}</span></span>`).join("")}</div>` : ""}
      <ul class="tasks">${day.tasks.map((tk,i)=>{
        const id=`${m.id}|${d}|${i}`;
        return `<li class="task"><label><input type="checkbox" id="cb-${m.id}-${d}-${i}" data-key="${id}" ${DONE[id]?"checked":""}>${chip(tk.k)}<span class="txt"><span>${tk.ar}</span><span class="en">${tk.en}</span>${tk.term?`<span class="term-inline"><b class="en">${tk.term[1]}</b> — ${tk.term[2]}: ${tk.term[3]}</span>`:""}</span></label></li>`;}).join("")}</ul>
    </article>`;
  }
  return `
  <a href="#family" class="muted" style="text-decoration:none;font-size:14px">→ كل الأقسام</a>
  <section class="profile">
    <span class="avatar">${m.ar[0]}</span>
    <div><h2>قسم ${m.ar} <span class="en muted" style="font-size:16px;font-weight:500">· ${m.en}'s plan</span></h2>
      <div class="facts"><span>العمر: <b class="en">${m.age}</b></span><span>${g.label}</span><span>الوقت اليومي: <b class="en">${g.minutes}</b> دقيقة</span></div>
      <div class="facts"><span>التركيز: ${m.focus}</span><span class="en">${m.focusEn}</span></div>
      ${m.ai?`<div class="facts"><a href="#ai">افتحي قاموس مصطلحات الذكاء الاصطناعي ←</a></div>`:""}
    </div>
    <div class="ring">${ring(s.pct)}<div><b>${s.pct}%</b><small class="en">${s.done}/${s.total}</small></div></div>
  </section>
  <div class="weeks" role="group" aria-label="الأسابيع">${Array.from({length:nWeeks},(_,i)=>{
      const a=dayDate(i*7), b=dayDate(Math.min(TOTAL-1,i*7+6));
      return `<button data-week="${i}" data-member="${m.id}" aria-pressed="${i===wk}" class="${i===todayWeek&&t>=0&&t<TOTAL?"has-today":""}"><b>الأسبوع ${i+1}</b><small>${pad(a.getDate())}/${pad(a.getMonth()+1)}–${pad(b.getDate())}/${pad(b.getMonth()+1)}</small></button>`;}).join("")}</div>
  <div class="week-info">
    <div class="card">${bi("موضوع الأسبوع","Theme")}<b>${W.ar}</b><span class="en muted">${W.en}</span></div>
    <div class="card">${bi("قاعدة الأسبوع","Grammar focus")}<b>${W.g}</b><span class="en muted">${W.gEn}</span></div>
    <div class="card">${bi("المرحلة","Phase")}<b>${["الأساس · A1–A2","البناء · B1","الاحتراف · B2+"][Math.min(2,Math.floor(from/30.5))]}</b><span class="en muted">Month ${Math.min(3,Math.floor(from/30.5)+1)} of 3</span></div>
  </div>
  <div class="days">${days}</div>`;
}

  return `

    <article class="term">
      <div class="term-top"><h3>${t[1]}</h3><span class="chip-k lvl-${t[0]}">${L.ar} · ${L.en}</span></div>
      <span class="ar">${t[2]}</span>

/* ===================== ROUTER ===================== */
function render(){
  const h = (location.hash || "#home").slice(1);
  const m = MEMBERS.find(x=>x.id===h);
  const tab = m ? "family" : (["home","levels","skills","apps","family","ai"].includes(h) ? h : "home");
  document.querySelectorAll("#tabs a").forEach(a=>a.setAttribute("aria-current", a.getAttribute("href")==="#"+tab ? "page" : "false"));
  const V = $("#view");
  V.innerHTML = m ? viewMember(m) : {home:viewHome, levels:viewLevels, skills:viewSkills, apps:viewApps, family:viewFamily, ai:viewAI}[tab]();
  return m;
}
function go(){
  const m = render();
  if (m){
    const t = todayIndex(), el = document.getElementById("day-"+t);
    if (el) setTimeout(()=>el.scrollIntoView({block:"start"}), 0); else window.scrollTo(0,0);
  } else window.scrollTo(0,0);
}
window.addEventListener("hashchange", go);

document.addEventListener("click", e=>{
  const b = e.target.closest("button,[data-skill]");
  if (!b) return;
  if (b.dataset.week){ viewState["w-"+b.dataset.member] = +b.dataset.week; store.set("ep-view",viewState); render(); }
  else if (b.dataset.skill){ viewState.skill = b.dataset.skill; store.set("ep-view",viewState); if (b.tagName==="BUTTON") render(); }
  else if (b.dataset.ai !== undefined){ viewState.ai = +b.dataset.ai; store.set("ep-view",viewState); render(); }
});
document.addEventListener("change", e=>{
  const cb = e.target;
  if (cb.matches('input[type="checkbox"][data-key]')){
    if (cb.checked) DONE[cb.dataset.key] = 1; else delete DONE[cb.dataset.key];
    store.set("ep-done", DONE);
    const y = window.scrollY; render(); window.scrollTo(0,y);
  }
});
document.addEventListener("input", e=>{
  if (e.target.id === "ai-search"){
    viewState.aiq = e.target.value;
    const pos = e.target.selectionStart; render();
    const s = $("#ai-search"); s.focus(); s.setSelectionRange(pos,pos);
  }
});
go();
</script>
